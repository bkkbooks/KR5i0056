body:
  text: 天仙金丹心法八洞仙祖合注第一立志三山笛史韓湘著仰止崇山心欲登而身即到羈縻密網數難避而理可回懸慧劍於靈臺斬斷邪關都匿迹握神樞於智府衝開法界任扶搖故鐵杵磨針不廢半途終造極石盤作蓋甘居死地得長生索祕妙於寶笈琅函務效蟻珠尋曲折葆性命於琳宫繡宇寧將繭緒苦糾奮玉斧以開基端憑意匠啓金繩以覺路朗注情田深斯入道之源以闢修真之要仇俗宇宙一積情之府而情即造孽之媒情以引其情遂流蕩而莫知所屆是故情濃於妻子則畢世馬牛情熾乎利名則終身韁鎖嗚呼韁鎖馬牛之業何在而非造孽之媒耶且即於用情之地無以纍吾情而世緣未決其藩則有用之居諸汩於俗情而坐失逮至鐘鳴漏盡撒手而空歸乃悔沈蕩於昏波而俗之纍人大也古者高人達士視俗如仇蓋深知妻子利名厚吾生適以賊吾性命也洎丹成九轉尊榮於億萬斯年祖禰之精魂且重聚三生石上視塵纍之馬牛韁鎖相遠何如也故仇俗之仇正以能仇同萬福詩流光如水不回瀾難把優遊救老殘曰我泄玄機聊破夢返童須覓大還丹探道太上演經廣成談道遂以啓苞符之祕而奧旨以傳大言之則布濩乾坤而斂則退藏於密可分可合可卷可舒化腐臭為神奇綿一息於終古道可道非常道而為道微矣顧所見異辭所聞異辭所傳聞又異辭討論之未精不能知止而有定何以窮乎其至變統宗而會元故就正高賢參稽載籍復本以澤山之虛受執中而不失其權至道之精亹亹來會矣鶴鳴之賦曰他山之石可以攻玉云有藉也延訪之殷也善納誨也吾為探道者誦詩詩庶物蚩蚩負氣來惟人靈秀有根荄曰窮源探取先天祕覷破玄關笑口開訪師七十子之徒得杏壇而具體而西來大意六祖傳燈吾道之淵源亦若是則已矣夫師以強教金針非靳於後人然而匪我求童蒙童蒙求我志應也感以誠也康成之擔簦遊楊之立雪故道成不朽甚至靑生於藍而勝藍顧德無常師一良鳥之擇木而栖也擇之不精必且下喬而入谷附訪師心訣待善參真輕雙齡舉紛非精如停假紋道門燒魂或深倘親者身眸童止紛本氣斯留者蛇巾旁黃招為幽其相孰健炯髮瀟答直與內勿孰帶道涉煮物大道失勿是足秀鶴灑對論神外切是眼服語白攝術莫察愼亟貌內骨言旨即品所難面頂粉蜜御法反奧玷道觀道藴頂語玄據三遇辨黑鶴飾如女小火玄污正其然光峩淸以丹聲乃疑神無儀口採施呼談淸心形岸明巍新叩經聲真質昏頭文厥陰或霖與名有詩真藍淘濯出高靑紹述仙宗認典型曰邀得月輪開北斗光風披拂侍玄亭質友孔子曰德不孤必有鄰言志孚也而淵明亦以疑義奇文必待同心賞析則中心之貺佽我亦良難而矧性命之圖擇交尤巨故附以質友切論詔爾後賢顧風雨廬中既已卜周行之示要必推心置腹略無我詐爾虞斯以叶于野之占而佐嚴師所未逮流露於面顔印堂與鼻端紅黃而潤遇此人而隆以早生以告罄交我與樂必誠積以之感受謙以之禮氣平舌不談故作深藏之態此包藏禍心之輩覩貌道所捫胡害受中術墮一耳財資取詐目名借深交中得或底哉廋焉人色其觀而言其察壤霄道言以胸失抑探道者其留意防之損益兩途判然家淺腹然之吾右而支左要切及問忌無言大即時面交心奧交臂抱憾終身矣至若冠裳艷麗既傲且狂或本玄談輕肯不凝渾必貌士之沈深故愚若智大曰古詩卜築巖阿樂隱棲素心願從白雲齊曰空齋永締金蘭譜並坐無言聽鳥啼遍採金丹心法集腋以成裘實薈古今丹訣之精華而畢羅其要而立志猶資遍採者堅後賢之信而驗錯綜參伍之奇也今夫揚赤壁之帆則樂其恬靜望黃牛之峽則驚厥險奇洎觀乎大海洋洋乃嘆𣾀百川而王百谷而細流不擇愈以益其深且諸集之言亦各自抒其所得然死生之界要害之關究未嘗別創新奇迷其正旨但有詳有略有粗有精有淺有深有顯有隱致其異統其同乃知心法之苦心而觀於海者難為水也故曰堅後賢之信驗錯綜參伍之奇也詩靜啓瓊函玩祕文鈎玄叵許剩餘芬曰參明藥火淸真旨好結元嬰現彩雲遠追收心十二時放眼三千界古人自命誠有味乎其言之故上下千年非直比方人物潔短較長蓋將於尚論之餘懸一的以相赴耳是故人上於我矣而人之上有人焉處下窺高由遠而溯洄至遠抗心翹首誰靳而封之且前哲之踨後人之鵠也士君子冥心孤詣無憑藉而猶興矧往聖可師胡不以神兩相印惟即古人之終始鐫髓而旌心讓以先登而不許其獨步安必效法乎上者僅得乎中也故以遠追為量也詩艷陽烘染百花洲水閣山亭快意遊曰忽見孤峯天外逈開襟更上一層樓戒欺戒欺者何也所以誠吾意盡人以合天也天以理為衡理以心為宅心安則理得理得則天全故修真必自戒欺始且心為神舍神以孕氣氣以生精虛憍之未融安得固精凝神而養氣况欺之未戒則情涉浮遊而真意不生曷以妙返觀之用惟立心應物毋俾一息矯誣則意罔不誠人盡而天心合矣旡妄則可盟金石中孚則可格豚魚此戒欺為天德王道之大間亦即修真之要旨詩拂拭心田舊異香秋蘭紉佩菊為裳曰取懷不假秦銅照肝膽分明皎雪霜求慊人心本至虛至虛故靈應靈應故能披剝萬象而見已而以至虛合太虛洎情為物遷重以百端交集遂使靈光一點蔽於愁雲苦霧中如猿哀秋如巵漏底寖銷漸牿神摧氣索而精血枯矣逮至因緣而生覺參幻以知空而一線之淸明不敵七情之隕穫是故達五明之路朗耀情宫疏八解之源澄淸性海要令躊躇滿志取之一體而皆逢靑山白雲江湖之水湛然可復有未慊之憾耶寸衷高朗百體充盈此為築築基之基而先煉煉已之已詩輕寧一氣轉神功復姤往來遞嬗中曰三十六宫春意盎鳶飛魚躍覺天空勤始學者邁征之詣力端重乎始基譬若稽田既勤敷災乃得修陳其疆畎梓材勤朴斫而後來之丹雘可加由邇以陟遐君子所為作事謀始也不然存畏葸之懷而無撒手懸崖之勇則經營不力安望積小以高大而成峻極之觀故志士勵行一念確乎其不拔而縱心孤往行健以自強此鵬鳥之為培風斯以背負靑天而莫之夭閼者也而後乃今將圖南詩東風餉暖苑花齊一刻千金肯自迷曰休戀穠華誇比翼孤桐原待鳳凰棲永終易曰不恆其德或承之羞士君子功廢半途或沮喪於垂成之會千載而下猶為撫膺太息而謂不成丈夫矣夫君子有終謙之所以亨而吉也乃以億世之崇高富貴而不能堅守其初心嗚呼自待抑何薄矣况築基三載百日丹成一十月胎而陽神自脫自時厥後此身已證長生曾日月之幾何而不愼終如始也書有之為山九仞功虧一簣此不恆其德而可承以羞者也立志者其惟懷永圖焉詩著屐尋山路幾更巖回翠杳覓鵬程曰攀蘿咫尺登峰頂莫墜靑雲負此生超凡三千大千凡界也處凡界而相濁者凡民也南柯之紫蟻排兵北陸之玄駒走隙為蕉為鹿是蝶是人當殘夢初回總是北邙衰草耳夫芝蘭茝蕙發幽谷之馨香雖蕭艾同敷而獨翛然其自遠然至金風玉露時勢交乘曩之卓冠羣英者依然與草木同其腐朽是以愚者刳心以掃智哲人蓄髓以憐肌非惟土石候鄉腐耽良錦實乃遊心冥淡解脫藩籬故上古大椿不與北邙衰草伍立超凡之志應作如是觀詩塵海茫茫萬里濤慈航那識榜人勞曰從今只度雞羣鶴奮翮凌風唳九臯軼聖上天之所報不報於其人而報於其人之天智效一官而無以崇莘野南陽之抱則用亦第如其器而稱物以施故酬不以願為媒而報要以人為劵聖真立志必使後無來者前無古人不甘於小成不以苟可安而止情之所至一往而深則安見前賢不畏後賢而後來者不居上金丹心法先以立志造其端玉宇瑤房金臺貝闕億萬載之攸躋而攸止此丕丕基也詩三華結就逈超塵纍劫修來第一真曰曾記洞天仙八萬紫雲端捧少年人第二端品蓬萊道人張果著黃中繕性道樞充管性之符玄牝棲神物軌啓參神之鑰運濠淳以植本玉粹金剛袪蹩躠以安貞氷懸雪跨故淇澳之琢磨有斐永千年𥈠聖之思首陽之薇蕨雖枯流萬古馨香之韻挺蒼松之徑節寧偕碧草凋殘瑩白璧之奇光直任靑蠅點落以沅芷杜蘅之澤為醴泉芝草之春斯篤實以禔躬定已精而益密自中和之在抱將希聖以離塵持身豫聞諸莊子道人無聞至德不得大人無已約分而不期且天而𢌿我以身大而化之之所由化先化其所化而化乃以神是故如奉盈如執玉如處女如履薄而臨深如困守於孤城而兩軍未憗如朽索之馭六馬翼乎其小心內天而主宰人外而斡旋本乎誠位乎愼達於理明於權蹢躅而屈伸反要而語極故曰無以人滅天無以故滅命無以得徇名謹持而弗失乃以反其真詩衾影無慚夢亦淸潔如霄露浥金莖曰元陽若化沖虛體管許雲飛覲玉京緘口山木自寇也膏火自煎也川不防其防而蟻封可潰為濫也故爾驕而道而人將誚之爾炫而玄而人將癲之其駟之不及也厭之不克捫也其溺之所為之不可使復之也咸其輔頰舌反唇而稽矣括坤四之囊愼不而害矣道吾道吾自道玄我玄我自玄守如瓶緘若金人背與物不相靡相刃物亦不與我抵牾惟口啓羞緘之不密也太上曰知者不言言者不知故聖人行不言之教詩搗碎玄霜旨趣甜真機默喻勿詹詹曰心花縱使傳迦葉也只含情信手拈輕財財者何塵垢也曷輕乎爾淸心也輕則曷以淸吝則愚貪則敗有其有者纍見有於人者憂是故象有齒以焚其身賄也石崇吝族於倫子魚貪尸諸木物物而不物於物道者為之公馬伏波文淵謂凡殖貨財在賑施否則守錢虜此志此物也輕所輕也輕所輕者不有其所有者也不有其所有而見有於人耶不開人之天而開天之天開天者德生開人者賊生不賊於賊而德全其德此之謂葆真詩珠輝玉潤彙珍田跨鶴何須十萬曰石忽變金金等石任情揮灑讓神仙納氣雖有忮心人不怨飄瓦惼人即易怒不怒於虛舟故虛已以遊物莫之害其聞人譽已適適然驚人譽人則自失人毁已已則益修人毁人婉為解蛇神牛鬼鬼斧神斤觸不驚犯不校是純氣之守也客氣不侵也其天守全其神無卻也無卻守全則無纍無纍則正平正平則與彼更生太虛為一詩世路戈矛暗裏藏一言偶悖忍相戕曰沖和雅量涵高遠鋒刃鎔成日月光友善井蛙不可語於海者拘於墟也夏蟲不可語於氷者篤於時也曲士不可語於道者束於教也夫教以師為鵠而以友為簪染以藍則靑染以朱則赤意怠之鳥翂翂翐翐而其行不斥得友聲也荃孤芳則茅為害曲寡和而調弗揚是故援靑松以誓心指白水以旌信攀嵇而鳳舉交吕亦鴻軒氣類符其神相許也故情莫如率形莫如緣詩舊雨忘言臭味馨芝蘭滿座繞丹經曰異香醉我醇於酒太史宵占聚德星絶讒從善則如登聽讒則如墜囊瓦之覆楚墓握而宫班宰嚭之亂吳社墟而臺沼讒者滑吾以俗且將冒吾以蔽蒙與衆君子遊莫沾所賸與一小人比則啜其醨入鮑魚之巿久而俱臭者蘄自畜於樊也夫其淳悶恢心方外袪夫塵垢詎遁天蹇道甘殉僉壬而德厚信矼敝敝於一二匪人蘄乎亂嗚呼殆為人災夫詩似酒東風滿翠微辛夷馝馞牡丹肥曰山窗莫聽鶯簧巧惱亂楊花撲面飛別嫌風之吹萬不同而使其自已也咸其自取怒者致怒其曷瘳有真君存焉愼焉而不𢌿以朕是以無有為有無有為有疇則摘其瑕納履乎爪田整冠乎李下何若是芒乎且已則已芒而曰人之芒於芒芒吾真宰乎因非因是因是因非不授以因因斯無朕故曰自彼則不見自知則知之古者上堂聲必揚夜行則以火不窺密入虛如有人充類而至義之盡乃曰別嫌聖人和之以是非而休乎天均復通為一詩冰心早向玉壼收寶相光圓滿慧樓曰掃盡微雲天不夜一輪霽月淨高秋安分分無常也而安有定定之以知止汝止以安焉不由而照之以天天則分也故滑疑之耀聖人所圖圖之者不用而寓諸庸也庸也者用也用也者通也通也者得也適得而幾矣因是已已而不知其然是之謂道是故困勉者之分安百千也得失疾遲安所安不相襲也心不欲雜雜則多多則擾擾則憂憂而不救為人使則徒勞使以天則無偽宜止而不止是謂坐馳體道之人入遊其樊弗馳而越畔詩守得靈樞定也無塵思銷盡驗工夫曰恬吟止所兼山卦不見行庭養若愚愼微司馬承楨云損之又損以至於無損夫損至無損是微而無微此道之樞亦品端之的也蓋至人之用心若鏡不將不逆虛而不藏體盡無窮而遊無朕受以天而無見得故心止於符夫欲惡經營喜怒淫佚意有所至而愛有所亡膚寸彌天虛蒸成菌以至驕僨而不可係嗚呼可畏也夫是故冥冥之中必剃厥萌寂寂之地母滋爾蒂深之又深而不為緒使密之又密而不為物絯琢雕復朴塊然獨以形立紛而封哉一以是終詩日暖之田蔚紫雯春光透漏已三分曰敷災莫待勾萌坼預倩靑鸞帶露耘杜漸壺子之聖也杜德機焉杜德機云者容貌若愚甚盛德也况已私之伏暗長而潛滋茁而軋矣申胥有言曰為虺不摧為蛇將曷若且坤之初六履霜而堅氷霜者陰始凝馴致則腹堅水澤矣是故外韄者不可繁而捉將內揵焉內韄者不可繆而捉將外揵焉淡而靜漠而淸調而間過之而不守鬱閉而不流乎其若詛盟以守勝也故素也者鉏焉而無所與雜也純也者屏焉而不虧其神也維屏維鉏乃純乃素詩石火光微勢燎原炎威况值巽風焮曰行人指説咸陽道痛惜阿房不忍言主信古之有道者不二二不參三信矣而不期光矣而不耀故其寢不莫其覺無憂恬淡虛無乃合天德夫天德者不言而信不介而孚日月四時各循其序陰陽萬古不改其經惛然若亡而存油然不形而神萬物畜而不知此之謂根本根乎本者媒媒鬱鬱豚魚可格實實淵淵盈缶可占宇泰定者發乎天光發乎天光者人見其人人有修者乃今有恆有恆者人舍之天助之故旡妄者元亨利貞而如匪正則有眚詩五卜孿如四可貞夔夔後甲問先庚曰靈臺自有溪毛薦不效狙公笑尾生存誠天以誠而淸地以誠而寧故兩誠相亞萬物皆化芒乎芴乎而無從出乎芴乎芒乎而無有疆乎萬物熙熙皆自誠基萬物職職皆自誠殖且道先以繕性也性而從於心心與心識知而無以反其性情而復其初是倒置也是故達生之情者不務生之所無以為達命之情者不務知之所無奈何慤而真虛而實靜一而不變淡而無為動而以天行以通乎物之所造養生之道也是為條逹而福持詩當初矢願往蓬萊鋭意還丹化玉胎曰靜養千年飛去也金針留得度羣材第三悔過紫微垣仙藍養素著寶鏡非臺叵任纎埃褻涴芝田似玉爭容灌莾叢生毒龍騰飛舞之奇破鐵圍而踴躍封豕突爪牙之孽排銅堞以披猖故伯玉知非每撫時以自勵淵明作賦思未遠其可追脫離欲海腥波猛立懸崖須撒手割斷名韁利鎖急尋覺路莫回頭匿瑕則以琢而瑩力振風雷之益蒙垢則由湔而潔光符日月之更惟霧斂與雲消自天空而海濶陽愆君子觀變玩占而悟道先補過矣夫無端失足踰間於身世之交自好之淸流一慚之不忍忍終身慚耶而况指靑雲以信修則疇曩之愆尤應已瞿然而愧矣愧且勵防之斯愈周虎尾春氷未許輕心掉也易曰不遠復旡祗悔以云吉也敦中行也迷復則凶而災且生也是以君子誦盤銘而自新以思永也詩仙子頻將玉斧修年年桂魄皎淸秋曰方諸夜半饒殘淚一點朦朧萬里愁陰慝修道以治心也惡慝於中而袪之不勇大學為正修之纍即玄基為性命之防然不必其伏危機蓄隱毒而懷狡憤厲胸中之刃藏笑面之戈如蜮如虺如蜂如蠆如林甫義府乃為黑風過海之幾也當其私意潛萌為猿而若馬無以遏其猖狂之勢而憧憧往來百感朋從乘虛入矣是故正心先愼獨刮垢務磨光詩自葆虛靈絶點瑕波心月影鏡中花曰輕塵不著真空界弱水三千好放槎身玷身曰身城示守也守有道日起有功守偶疏動而得咎身也者積善之區亦積愆之藪也且夫往來之劇也酬酢之棼也入於其中而身城自化雖甚盛德猶且難之是故身之冒貢於非幾也猶雉堞之崩而壞也彌其缺則繕而完補其苴則豐而固漆城蕩蕩寇來不上雖乘其墉弗克攻也古人所以重崇垣勤救度也愼斯術也可以磨吾玷夫乃得以城吾身詩消盡陰霾鼓太和風光淡宕五雲多曰昻頭試向蓬瀛望島嶼煙淸靖海波口鋒天道不言而五行布四序章品物亨而歲功順也人之有口也善敗興焉出好興戎惟其所召也是故吉人之辭寡躁人之辭多仁人之言必藹如而其利溥也逞鋒而鬬捷則傷天地之和也緝緝翩翩乘機而搆禍人所怒鬼神所呵也是以君子愼密而不出也詩檻外山靑水自流尋春底事説春愁曰杜鵑呌月黃鸝罵斷送東風不掉頭利縻財賄之於人甚矣求之未得而害已隨之利蓋害之媒而生人之怨府也士君子淸虛結撰輕軒冕於泥塗則大寶在三珠玉金錢非所與然乞假或通於疇昔而以空山為避債之臺公私兩憾矣夫報賜以力自古有之以吾所有餘默以濟其不足則玄科經法亦可以償也詩有之投我以桃報之以李以云稱也無負於人也詩豪富何嘗到九泉銅山金窟總徒然曰倘教瞋目能將去底用兒孫化紙錢色障嗚呼君子歌鄭衛諸篇嘆淫奔之鑑炯矣夫一朝失足千古遺羞則筆伐口誅烈於五刑之顯戮然必其定情於薦枕乃為亂男女之防則雲荼須友之章昔人何以廢書而嘆故當其目挑心許而繫懷於我見猶憐則一念之不自持未必不抱慙於淸夜而猶未也謂陰陽配偶古今人道之大倫而鼓鐘琴瑟之調或敝於色斤之戕伐殆非所以尊性命而知保合夫太和故毋搖爾精乃得廣成之大要詩載酒尋花醉聽鶯鶯花適興酒陶情曰花殘酒醒鶯何處淚灑離筵夜雨鳴浪墨才士多功才士亦多過夫摛華掞藻半皆海市蜃樓而略涉風情見者遂眠花而躤柳而况一時逞意顚倒乎人心風化死生榮辱之關雖幸免乎明刑竊恐難逃隱禍耳修真之士應不忍為然濡墨吮毫稍流於過當或騁才於往日或寄興於無心要當細檢生平勿俾流患於將來以自虧其德行詩莫將揮翰逞才雄隱禍恆藏巧説中曰感發天良時惜墨筆花垂露寫春風貪饞食飮以滋榮衛也采溪澗之毛而王公可薦非窮水陸之奇也夫酒食之貪厥惟叨餮比之於混沌窮奇檮杌名以四凶帝舜投之於四夷以禦魑魅君子曰口腹之纍人甚矣今夫采於山美可茹也采其芹鮮可食也簞瓢而疏水可以樂飢也羅百味之甘侈八珍之奉極滋味於刀砧鼎鑊而𡨚慘何堪嗚呼是顚頤也是拂經也是舍爾靈龜觀我朵頤而非居貞之吉也故曰養其大者為大人詩控首西山弔采薇馨香爼豆日增輝曰養生甘茹園蔬味堪鄙持粱齒獨肥誤蒙吉凶悔吝者生乎動者也當幾務猝投之會而未及致詳雖有意以矜持竊不禁無端擾亂故吉居其一而凶與悔吝恆踞其三焉士君子言行之偶違豈遽遺罔念作狂之咎而防之不密乃至寖昌寖熾若狂瀾之既倒而難回謂始也無心而繼流為有意也是故憂悔吝者存乎介震旡咎者存乎悔詩西園柳絮小橋東點點殘花落滿叢曰畢竟自來還自去月明誰鎖紫深宮甘蹈人雖甚不肖日沈溺於迷津及淸夜捫心未必不增其氷谷逮至蝸名蠅利薄於途窮日暮之餘遂倒行而逆施之有不遑恤矣在豐之上九豐其屋蔀其家困卦九三爻據於蒺藜困於石必也來章有慶譽明而貞斯大人吉耳夫非禮勿履大壯所以亨也晉如愁如而利貞是以受茲介福也不然而弗過防之從或戕之雖有聖神愛莫能助也君子故曰省其身也詩五湖遊泳水如藍釣餌芳甘未可貪曰佇聽春雷振鱗甲禹門躍浪擁雲龕監往過已往矣雖悔其何追然士無懲創之心則萌蘖潛滋直若輕車熟路耳譬如平地坦夷本無所虧溝而為積坳則四隅之濁淖泥塗乘虛而坌集逮晞陽久照積潦寖消而培壅未施遇奔流而復入下流之地衆惡所歸玩坎窗之占可以知補過矣以創巨痛深之戒貞其返照之神斯執競以行不續前車之覆詩春風暗度曲闌亭繞徑山梅送遠馨曰野雀忽來偷眼看惜花又挂護花鈴察來過之來也覺焉而不二其見天地之心乎小畜四爻有孚血去惕出蓋柔而得正虛中巽體而補之以剛是有孚而血去惕出也大過之初六藉用白茅畏而愼焉不嫌其過故皆旡咎也今夫北闕之輕陰既散則南山積翠鬱浡而自流雲蔚霞蒸觸石而呈五色是故志之立品之端積善之本原莫不受成於改過詩轉盼風光覺昨非陽和初動莫輕違曰審時採取靑麟髓煉出飛仙上紫微第四遷善醒眼道人曹器杰著天上同仁普湛恩之雨露世間最樂培心地之芝蘭餘芬揚口角之和寒消嶰竹挽水解枯魚之泣暖躍春波故生蛭濳吞伯略創瀟湘之績慧星退舍芳名流泰岱之封垂淨業於無倪還假道樞成慧業廣福田而有種盡祛人械葆珍田合儒家視履之祥其旋元吉兼釋氏波羅之諦自在行深惟積少成多務躊躇而滿志自增高繼長充法勝以諧因捨資財者宇宙之川流而生人之借徑也積而能散用之而各協其宜乃孚天地之盈虛而不為守虜然必若太原荀恁散資財於九族而高隱終身馬援班榖畜於親鄰而身自羊裘皮繹君子曰此非人情不可近舍之而不合其宜學人自悔過以來酌盈劑虛而胸無繫吝行陰功事發至誠心為善無近名施恩不望報以生民之大命還之而為天地之大公是為流宇宙之川流而善假生人之借徑詩福地開從積善門權憑慧眼照黃昏曰途窮那待西江水一勺能沾活鮒恩給藥異卉靈根不可以回天而可以解人之疾疫彼室家溫飽則藥籠中物可投於治標治本之時乃如貧病顚連則一人向隅舉室皆為飲泣或限於鄉村之僻遠誰驅二豎之殃或窮於痼疾之綿莫覓三年之艾作善者按方修製依症送施如扁鵲重生飲以上池之水也夫蘇耽之井董奉之林藥盞丹鐺遂作證仙基業故覓長生之術者莫先於衛人之生詩華陽洞口白雲隈炮煉靈丹轉又回曰一切回春歌夀愷歡欣童叟到熙臺放生天地之大德曰生大生廣生而生生不已而所生之物亦本生物之心以為心故凡欲長生須種放生果且物雖微賤莫不惡死而欲生故鱠餘之魚復振鱗於吳水膳後之豕翻化龜於魯津况即其生而生之則刀砧擭之餘胥荷再生之澤夫隋侯楊寶毛寶宋庠一念之所將永膺多福而龍宫酬德且以禁方濟世躋天府之上真惟擴此生機創放生池苑捐金勸募俾復其生夫是為好生好生者長生之劵詩物我含生兩不干相逢底事忽相殘曰仙郎若解無情網一覺阿門夢也安印典儒釋道教譬則三光經典之創垂若江河之行地且經者徑也揭信修之路而導之於天衢也昔人見桃花而悟道則覩茲密諦益啓金繩寶筏之光故根器深者因緣以生覺其次則遁途守轍求列聖之心燈又其次信從因文義而知寡過故經以彰教教明而道乃行矣印經則經以印心所以衍在天之寶祕亦心因經印而流心法於後人詩了性還丹化雨深刋成經録度金針曰饒將十二龍賓彩演出空玄覺世心方便善無大小而善量無窮力所得為而為之皆可為人物養和平之福解杖頭之費輸囊底之金斯遐邇異同均沐和風噓植矣甚則鬼神欣所托貧苦得所安而語言文字之無多足以釋𡨚而弭禍蓋舉生人之所便即皆為作善之方終日乾乾而與時偕極亦安有輕重優劣強分大小之名耶至如所便之有方凡其方之所甚便則感應篇陰隲文兩卷言之大詳豫故不縷言而但統之曰方便詩煙光一派曉寒空點綴林泉補化工曰滿地花香天女散等間幽谷遍東風隨緣善生於性之有所結亦結於心之有所憑故未至寂然方至勃然有感而遂通是則隨緣之謂也所以見所見聞所聞意所將足所即輔頰形神之所麗無非作善之據依故緣隨念生隨時寓隨境隨情締佛家所謂積幻而成也然滿腔皆至善所凝斯積善以隨緑而具而種因之説則流於望報而有求非儒家盡性之所推即不足以云吾道詩暫向修途了宿緑吟風嘯月興翛然曰溪山引到雲深處流水桃花別有天敦倫君父之大倫與天地無終極聖神之功化莫不由庸行之修故當其釋褐而登與夫敘天倫之樂事者至情至性宜有肫然莫解之真乃踐土食毛未綰半通之組綬秋霜春露遽深終古之悲思要無庸以地逖時乖而不覃心於忠孝此儒與道之必基於大本不同釋氏之空也至若真卿殉節以忘身而神歸絳闕吳猛酬恩於罔極而位陟璚宮此皆忠孝之楷模而振玄風於不朽者也故遠君邇父為遷善之大間詩九萬程遙水一鄉雲鵬鯤化任翺翔曰圖南未踏梧桐月恩滿深林感鳳皇復性春溫秋肅造化之大綱而恩威並濟之宜即聖神之作用所以旌陽成道仁義兼施點瓦礫為黃金以濟閭閻困乏而孽龍之斬水赤洪波爰位極瑤階晉天樞之上相且立人之道仁義為宗體仁則足以長人和義則正為利物故學人之遷善仁義其大經嗚呼因心作則無煩筐脯之捐稱物平施自合乾坤之撰苟恩明而誼美自返本以還元詩洪鈞宣化有無間雨露風霆疊往還曰識得帝先聲臭杳曉山聳翠白雲間植躬善在人者或難必而在已者有獨操况責善於人而返已轉多未盡既無以正帥人之實且將反唇而稽矣趙淸獻公之暮必告天張忠定乖崖不欺暗室古來賢聖凡皆重以修能也非然者儲性命之精而入德不深其懋勉則衾影多疚心之事天其謂我何故式玉如金跬步凛旦明之鑒黃昏淸夜寸衷見天地之心舉力所能為隨分隨時所宜盡以中心之好擴之流離造次而無違斯善念善端克底安貞之吉詩卓犖幽懷愛寂寥懶隨凡艷鬬花朝曰澗槃厯盡氷霜冷虬幹稜稜挺碧霄成物蓋人同此心心同此理而後知後覺必相須乎佑啓之賢是故惟善與人同斯大道之行放之而凖且人雖不肖而感以天良與禍福未嘗不惕息而駭心故因壘而降祟舞干而苗格剌史遠鱷魚之害申公點頑石之頭則同善於人人必有同其好者夫伯玉恥獨為君子而東漢之三君八及八厨八顧均此循循善誘之思故大道為公自成而成物詩晚霖滂沛樂沾濡谷草巖花儼欲蘇曰奬勵羣倫施化雨士風廉介景師儒博濟秉彝好德之良理不歧於畛域聖賢立則思俱立而成不獨成夫博濟之功堯舜猶難滿願乃求諸修士人將共笑其不情然以人心所樂從而導之以力所能致則托詩書以致遠其為道易明而其教亦易從矣其或限於力所不足無以施其普被之方而與人同善之懷近不遺而遠不禦若長房縮地山川盡括於門牆媧后補天缺陷不留其罅隙心之所必到斯善量之皆周非實亦非虛而道乃達諸天下詩墜露冷冷警素秋炎歊滌盡九天愁曰風回萬里銀河逈尚許仙橋渡女牛垂光修道所以修性命顧性命之真本同符於天地則欲與天長地久必善量永貞而不敝乃堪合撰於乾坤是故通遷善之大凡俾昭垂乎來許使後人之興起者欲歌欲泣偕風雨以交深亦步亦趨撫琴瑟而自遠而吾性吾命乃能攸久無疆矣學人自悔過以來志以立品以端統人已以靡遺合億萬年為胞與則人盡而天以見乃可語超凡證聖之功詩千年綵筆掞星河善誘無聲夢覺多曰醒眼蓬萊淸淺後春風掩卷幾悲歌第五築基鐵杖老人李元中著梯山航海造端先伊邇之區秋實春華滋長在植根之固得玄珠於象罔須淘赤水三周搜白玉於淸源合饗丹膏五味故芙蓉殿逈經營居黝埡之前玳𤦛樓高朴斫視登馮之密定鼎而年八百因稼穡以開基培風而路三千藉波濤以奮翼尋源探本潛圖彼岸之功聚礫延砂即振為山之業假無形之畚插式固身城憑有定之津梁勤疏性海精精者何水之母坎之源也先天之精淸而虛後天之精濁而實先天曷謂曰知識未開氤氲內結無形無象藏貫肢節間先天精後天之精之本也逮至情緣起嗜欲萌一點真精變化後天之液念起精起念伏精伏循環生息不竭不窮故有形者後天精非先天之謂凡基之築築先天也築先天何也曰後天濁且實且媾之而化生而况淸虛醖釀於官骸玄牝勤加採煉寧不成形成象結聖胎故示以先天為祕諦應者念先而生之補氣即太是培之𡆬根心形而𦝨化未偕真而藴以彩盈鴻虛合乍元闢丶以為成藥物聚佛則祖之圞牟於二所由散成則神草干屳益水之於金四所㑀由居結者向也色倘侣欲羊煉脂先務洷土水先於識后此詩混沌含苞玉露團化機恍惚要尋端曰可知粒粒崑源採莫向鮫人泣處看氣曷為氣無象無形無聲無臭天地之生理人物所由生曷為無聲曰有聲者呼吸是息也氣之用非氣之真也氣藏氣海中息之體也氣何起曰丹田介任督之間而交會於上齒下齒之尖處築基築真氣毋於息求之築氣云者伏息於氣中而不動元氣乃內含能內含斯不泄然而意到則氣到意停則氣停由勉而安灑灑洋洋斯腹皆充實義詳祕授待善參人有形串冓亦有之洷土水流即祖是於在脊下第節伏踵又工之後筋非不鬆血非不流太則不則欲三之身無之會水又月本川川何先之也起海夾㘠之得以在足腳卩跟骨此能活脈此得行過喘及促其惟吸來相而吸來相亦為所伏伏龜鶴置毛鼻而動聯丶彼得無之初不或或當意求可端平呼往之稱呼往之稱止平非以必息鴻於也不自於處此煉成價辣束庚矣學知行走住以想之詩光回海底耀蟾蜍翠浪淸煙自卷舒曰且住河車窺倒影風幡不動恰如如神陰陽不測之謂神天地之顯藏而人得之以運用穎異超忽莫可名言然神曰元神非思慮聰明之謂藏諸真宰秉於先天喜不能傷怒不能損故一神兩化化於元神神曰元故能化逮能化自成神是故煉而為心神現而為陽神飛而為天神神之靈神所運故曰穎異超忽莫可名言也莫名而名之是有訣丶肺下之三左所之聖所之其中外如中星畢中屬卯立一一之動而則光息發千亘所夜先常之且可則飛然入一乎先又月月有日也形妄旡結鄉麗四右上心之居不體放後華而越里行日謂而明丶斂以寂形其石也人知以慮後之而慮有時是靈為丶靈至知丶便恐先得所前戒足用心損靈者不慮也後損前聰而之後聰以先便得至丶為用心當不大干者之時特是有與以知用以慮先聰而非覺損漸漸絶減先始見止其散丶失之而無倦歸欲後知必丶消者亡當其以殆此盡訣故參之可將也元魂神金神火圖魄詩空非幻有有非空一點精英帝謂通曰欲見廬山真面目回光便識主人翁固精精之生也念生之精之固也念固之念消於無有精斯守一而不流消念將奈何塞聰蔽明忘聞見也念不起妄乃不生妄不生精乃固堅持密守由勉而幾安是曰內固外固者何也冬毋過暖夏不過涼春不觀花秋毋玩月疾走如風側卧如弓端坐如鐘直立如松外斯固外固則流治內固則源淸久則筋骸有聲聞百步是為精足為固精附以繫辭申其略過修三丹關者淸必而萬不緣濁悉如盡松諸是精故暑接之女正色不恍觀如不浮玩雲杜之花想外精出根充自滿無於業一繩身以而繫有念過月不生寒自之心奚中容以緩不也得哉成可驗一皆欲俾後除時天如有風補是無目固不一道見我之易由得髓固保事隙失可本乘末如先回定矣股空其虛然以之先無下項文俾倣夢此弓後為固由妖固之涼精矣可從前之抵愼膝道是之睛之但精於直其腸劍足耳賊所竊錯旁勿道人俾理戚者勉種也念不之足不精必之喜天歡後作固稍是虛靈暗俾欲心慧精不當之泄天則先滿補絶我則任企種欲邪暖天有後既其密化嚴入時無時因間安防室精內石不鐵至副停一不出而熬動中體漏四屋行固即是斷鐘不如之入根得情緣根無情魔斬凶精裏詩湛寂靈濤浪已平澄懷對境渾無情曰自然截斷橫流水靜看春潮日日生養氣氣曷養也順以馭緩以行窄以通扣以走疾徐得法而過度適中也一關未度則反水逆流凝結一方成惡症顧為馭為行為通為走關之過根之由氣為之而意主之意導先路氣步其後塵曷為根之由氣自丹田氣海來一脈兩支分途而交會外由尾閭穴周行督脈間內自前陰而周行於任脈逮至上齒下齒肉尖相對處曰交會關陽督下度於任陰任上度於督陰陽和會斯充滿而不停先以意者假以作探非長以意尚蹈空虛馭曷順任督兩經分上分下上者上勿下回下者下勿上提倒行逆施則停滯而生瘡疾緩以行何也上下以漸毋急遽致發而難收也窄也者謂上下於筋骸際膏肓間路如一線微毋散毋粗有不歸元之弊扣者何上下之行不離所主督氣下於任根繫尾閭穴任氣上走督根猶著於前陰首尾不空乃蟬聯如貫珠而生生不息至疾走傷氣毋若固精心性和平毋暴怒則氣可以養訣乃許商分分分時以魚日事吐手珠物陽養一丸而如時難戲之由擘香塊綿至息以沌混匕匕之匕第匕擊以拳女漸十攴方乃由兼欠身體之憂用甲乙全十分此得庳進雖頓工於不也亦如中不運而伏口是法歸降夫廾是於每先川窮歸當運如未源矣行遏後無川言之之養不而一者此其用以其為義道先而體也用自合明之剛養運川前以為而大一言伏得與所以以而心終祗伏其言已土言體法伏日有不之至之還等丹性力求行古坐土木其往流停之必者既時而之無至乎汗把傾及必源終有言口崩而為漫五言口閉而而死行記而必丹止之養故鴛鏡川握曰腹又如而不而是方動痛而東巴爭極虗內縮亟卯一行如囊周木如體隱不蓋是旋攴方琁王出此一有是幸有為次方詩復道雙回徑易訛芟夷灌莽散煙蘿曰白雲聯絡埋幽谷保合天根釀太和凝神神曷凝凝於斂斂則神深固無耗散憂築基當神未足時戒多言戒多視戒多聽戒多思愈凝愈靈神斯歸舍曷為舍肺第三葉間魂魄所棲息也凝而不放自歸元丹鍊九還胎於斯結故凝神之日寅則起亥乃眠少著重衣食多辛味不多視聽曷如不視聽不多思與言何若勿思而勿言洎能七晝夜無眠是謂凝神效為揭波羅諦俟有心人口神不土而團凝須取而從於土時毋反有伏昏中神有木不與固且靈示口常呆土扁久靜隨足動小從昏精是凝走申木周從之遁豚體則中氣以空兀欲色華鳥未於目亥身而谷聞見無日在聰所草豈風知聲日獨口全人無刀耳間欠而所守有月日聞化終著戾捐王見見無有存門見有聞貌月在容祕寉慮時躍示心木謂衣躍凝非不道木其由啓為動才謂魚之之而申培幾之甫一神實飛然古心靜旋飛由田其方後是得先鳥之非而必旋生至門方空不凝入古言口饒凝而誚體靈云者前發領言常也羊羊不然色月吾木舌神遽又有覺活細文文會王心望舍僧是坐之本講古心則乑丿為所的可魚星星有二詩活潑心源朗碧天涵虛無著影常懸曰但將陽燧歸銀浦煦養珠胎指日圓循天時循天時曷謂謂以臟腑上中下循孟仲季四時也精旺於冬亥子之交關乃陰陽之配合基初築煉精自孟冬依前説固之加嚴密而日居已午功則較鬆恐相衝元精不保庚辛申酉日功則有加義取生生是為月計日計者每時丁已午則肖庚辛申酉日程功申酉時照已午支從鬆放臨戍不卧至丑即興飮食須以卯未時食毋過不及氣旺在春初養氣月從寅卯月內逢申酉則與固精反功有加一日九過關較平日五周多四度曷以故氣懼剝而申酉皆金一與寅卯衝則金強尅木防其剝故倍嚴然大者毋放小者宜疏過膠柱氣曷活而靈故每申酉時略鬆息起居飲食同固精第緩步徐行勿若固精之疾走神旺於四季凝神者始於辰戌丑未月顧煉精與氣視日所衝神所由凝獨不言衝而言合戌合卯丑合子辰合酉未合午日逢合默坐一晝夜以寧靜而致遠云日在丙丁為土之母遇此兩日則時坐時行回環一周以取胎動將生意神貴生生生而不息乃藴靈於舍畢達其光三品適中基乃築語云山中無甲子方外不知年入山築基而日月支千於何稽考惟預求精厯法者推算後三年月建之大小逐日之千支録貼單房厯一日則抹除一日行功煉度乃不朦朧耳至日上起時時無定候然就晨光之隱顯驗晝夜之循環用返照之虛靈參陰陽之消息依時按刻而工夫真矣其道甚微豫試詳其説二月太陽出沒原非一定正九出乙入庚二八卯酉十於偏日之七三右於斜日之九正逮然亦八二是歲左不過五尺四六月間亦如三七之偏數逾疑焉一皆中照時他餘其定為會來陽真空悉念二無三蓋辰去皆子午二時按刻而推罔有不中萬尺中七冬申時屬夜分無論春夏秋冬俱以吾心之五日四兩是子別之丈一尺九尺八有約右在冬三寸時六季問而仲冬月出巽入坤又一定之數其五月午則孟乾歸艮出中天月五異之戍在寅在辛在甲在有修養三品者能動察靜觀潛孚默運誰曰山中無甲子而方外不知年耶至前文所云緊與鬆者乃合三品淺深論毋徒認淺功失內外同符操縱咸宜之道詩漫辟藤蘿叩曉暾結廬松嶺逼天閽曰煙霄甲子容疏放始信雲窩事業尊因地利因也者遠因天下近因一室一身也燕晉之分先煉精坎水也齊魯則先氣木旺東也鄭衛居中先煉神戊已也漢中秦陝則取金生水先煉精楚蜀暨閩越煉光神火生土也氣精交煉取水生木者燕與朝鮮也曷為近在身與室煉精宜面北氣亦然煉氣東亦宜精則否精宜北亦宜西然欲充且固朝宜東北方暮西北煉神者中處法宜流轉向四方又必面多南火生土也他如金日生者廬結西水日生者廬宜北木日與火宜東或宜南凡皆以云因也附以訣地利之因煉三品也隨其所值因以制宜文已載明毋庸贅至若東西南朔各有宜從或循環以周流或中立而不倚則以外功論非內功也蓋外功之動靜有常而內則神明不測豫更申其説惟有心者體之矣神死落一方按助氣遊性頻得有活之中精養夫丹而氣呆化而未我生性中為不定為活神養之內結不死想而處身所之外心轉時向伏神凝氣中功以能精則方神功煉方各住換坐者為也氣中精何藥生死為依實內之某迎心只默當養為伏之固是細為參詳為辨地利盡而人事成矣至如卜築於山結廬於靜趨乎吉避乎凶文詳煉已卷中不參末議詩軒轅頂上鳳皇巢戶有雲封不許敲曰五色光中香十里靈芝繞遍月輪包本人和曷為道天下之所公曷以修盡人皆可證然得天者異築宜分精不足者先煉精氣不足者先煉氣神不足者先煉神三品皆足則分三日而煉精煉氣煉神焉皆不足則分三時而煉精煉氣煉神焉否則輕重淆後先紊基之壞築之乖也足不足之分參以訣成形之身有五臟結丹之藥惟三品精為水水屬腎氣為木為火而木火屬肝屬心神為金為土而金土屬肺與脾五臟有虛實煉三品之所以必分先後也實再眼珠圓左浮為虛右沈非實左沈實再目黑而弦為實左寸憑脈性一看眼珠脈分左澀為實右關左關屬肝以修養之士欲知虛實當一右寸屬肺以屬心以細為右寸關尺六部兩尺屬腎屬脾以洪為高便為氣足右浮瞳若點漆則為精足光便為神足虛實定先後分至骨節有聲呼吸平能不寐三品斯足乃真和繼以行持藥生丹結自另更五臟成真人詩一顆明珠十載思驪龍頷下幾人知曰於今參透真消息涉海求珍總是癡培後補先培補者培後天三品補先天也蓋先天之精得之以生生之可無死洎汨於後天之鑿遂及先天築基築童精無培補否則除妄念斷情根俾生育之精復充滿久則還其本歸其元珠現於崑源而先天足先天之氣朗潤而輕淸無往來無出入靈臺不靜則消為血氣纍於後天始築基未知伏氣運之使充周漸運漸平置鴻毛鼻端而不動氣乃復先天至先天之神神所由化斂則如卵精瑩內含放則如珠光華外露動則流焉而活潑靜則寂然其常惺大擴九州小藏一芥六通智慧用之而漸虧一點真靈撓之而必散故戕以思慮賊以營謀疲以遠行昏以晝寢日以侵剝曷以凝培補云者勿疲勿昏勿戕勿賊語言聞見悉厝渾忘神乃凝附訣一篇示培補培後補先是固精養氣凝神體用兼全三才各得後還精於生精之所還氣於生氣之所還神於生神之所以後天至足補先天之不足也還但有精每法亥日時子就先之單右左行急步百兩又勒拳兩緊挺臂下直二捽四十然次盤後單坐存上遍想真體升陽泥集宫丸心由第竅糸三注下門命元還是如十四次九得方火烈升上集為丸泥涼景下冰為咽心過景竅火有淬炭之水為聲命注景門得既景真持更七行精日還乃還元有氣每法已日時午行徐步百單上坐端氣運周一氣伏次一一至七伏口日呼絶氣吸還乃還元有神每法申日時酉單坐動不不既還若有精想存迹之不又還若有氣行運用之住神中心遊光外身心身了了任純然自四厯九十後日於能室暗物見乃神元還各淸其緒先後不淆則三品皆還先天悉足再為聯貫則化三品迹益有加倘精未還而遽思還氣氣未還而遽思還神神未還而遽絶培補則差之毫釐謬以千里未見其有得也詩圓蓋包羅運左旋愁聞八柱觸當年曰媧皇已煉崑崙石不教東南有漏天由分入合水為精木火為氣金土合為神五行各有司不相攝分者強之合而築基者瞀於從顧分者終分丹奚結故三品既煉培補功己成俾精合其神神合其氣關元內纍若貫珠藏諸玄牝間備採取否則精雖足散而無依是為舍利珠非真聚氣祇屏呼吸神徒定往還陰而非陽釋家之諦也由分入合訣可詳由分入合是聯三品為一氣如兩儀八卦返本還元同歸於混沌之太極也但精藏丹田所處最下氣藏氣海所處居中神藏神室所處在上欲上中下打成一片則非檢絲以貫之不可謂絲夫所吾真者即之真心中也以意是氣則神合注神一意想法用存於氣降神兩目海至兩耳失明厯七失聰復明日而乃為復聰其氣神合神合以氣一意精則移神注氣丹田氣於存想仍用合氣如神內一覺腹氣滚股熱下目上滚壁耳光射里乃聞十合其為神合其氣氣精三品歸一自生藥生丹供採取而烹煉矣至謂結丹為煉精化氣結胎為煉氣化神是雖三品一氣而元神之主尚居神室元氣之母尚居氣海氣母鼓無形之火神主造有象之兒前後境地本不相混細參之詩上苑風和細雨賒催開穠艷領春華曰花光日影都成采篆就蓬萊一縷霞化有為無修真煉道以合天也然天有精精何見天有氣氣無形天有神神曷在靜專而動直故大生焉彼其培後補先由分入合蓋猶存迹象未渾忘惟時為內收勿俾在外寖融漸化無物可窺乃可以合天採真藥化有為無太極而無極也無極本虛空無臭無聲而生生莫測三品之合同而化則博返約實還虛逮生藥生丹則又無極而太極而兩儀八卦別立乾坤為無其然化有惟盤坐法自在十一日單床八木心似身若稿非入定死灰雖無知念而無識而精自不及精及氣而化念不念不及氣自化自化所神而神再從無化殆盡得真藥生有自取不成加以採金丹乎真正之此卷為修真第一關築之堅其基乃固風霆水火無震撼虞豫願後人皆為造五鳳樓手而若縛茅舍庇雨風甕牖繩樞非所望故罄抒所得作築基詩心齋宴坐我忘吾冥契高玄古丈夫曰神返太初偕物化宛如飛雪點洪爐第六煉己盍縷道人何淑淸著一鶴相隨望靑山而遐舉雙鳬忽化跨緑水以橫飛趺跏非委蛻之蟬結念而調龍虎湛寂擬蘧廬之蝶空形以駕鳳凰故巨石苦鑽研卌載邀天穿洞穴高崖勤注視九年立地現丹珠罕見罕聞比生若滅忘言忘象俾坐如眠雲洞影蕭蕭一粒粟中藏日月石牀心炯炯三升鐺內煮山川築基之會有精修鑄道功憑煉己安鼎之先開祕諦還丹妙在還神擇地功分煉己參合於築基顧三品既修念切成丹己多疏放矣夫雲衢修阻不容鹵莽問津惟萬念皆空於還虛之先預啓還虛之徑斯有基勿壞爐乃可安然其目宜詳其序宜辨一曰擇地蓋湫隘囂塵之境耽淸曠者尚弗居矧性命初修正君子攸芋日也惟是深山窮谷路杳而峰回寥廓淸幽乃與性天相洽而漁樵絶迹鳥獸潛蹤雖未涉蓬瀛已入天台勝境矣竹堪棟瓦屋可把茅而峻嶺孤峯依為良友門迎北向取子水之生陽也休傷杜死玄白諸方所宜避也牆宜黃土俾厚且高喬木深林愼毋密邇蓋風聲樹影最易驚我聽聞而鳥雀蟲蛇每借穠陰而擾攘况幽棲遠蹈同志良難結侣偶乖且致中途兩敗故住山之事須思患為預防至若結廬前後帶水為佳碧澗淸流既作荆扉保障而湔除塵垢滌蕩襟懷飮食所需亦覺取㩦甚便故地之擇也實為煉已先圖詩遁迹桃源久避秦漁郎洵是有心人曰停舟步訪雲山古風景春和不記春審單功自築基後三品歸元水火烹煉之交宜可以上單採藥矣顧單非床比可偃仰而安舒而八柱衡霄三階𣊟月天梯借徑此其先聲矣然名之以單取端凝而不倚也式方三尺木用生榆四足堅牢高一尺八寸結繩綿且軟上安棕墊廣如單纍以布裀中心特高起所以防穀道俾無泄氣云單安室中四壁令旡倚著庶昏沉傾仆及時而可震驚耳單取渾堅不惟其工巧空山無匠作好自為之詩蕭疏四壁倚微茫兀坐無聲藥草香曰定息潛通三島路幾曾尋夢到羲皇直體丹之煉也煉以坐功蓋坐則身不傾斜三品之往來得以過關度穴否則三關不透矣五臟不靈矣滿腹之精華欹而屈矣必令如壁立竦乎若丈人之峯不然寧暫下單床略舒肢體厯之既久自堪由勉而安詩秋滿空山露氣濃翠微巖畔秀孤松曰亭亭矗立干霄漢逈異黃山老蟄龍寧魂魂之昏也其原在散魂之定也其道在靈暗汶而弗瑩是即傾頽所自也目不視而光留一線耳不聞而竇啓三分一點靈機握於神明之府淸澄若水靜定如山虛含鏡影之空照擬燈光之聚斯不流於暗而得一以寧詳具下條合參而道可悟矣詩暗收月魄養靈根定裏光生醒若存曰恍駐碧雲觀自在頓忘塵世有黃昏死心修道以蘄不死也然心不死則神不生雖倚著於無形而性已為形所纍故知精足矣氣神已化液而流知神氣充矣神氣已欲銷而散惟恐耳聞目見矣聲色已環生存直體之思一身逾不適自喜煉丹採藥矣丹已走藥已枯見有靈胎而胎已幻矣有意間魔孽奇鬼已欲攫人矣妄來於心心未死也善夫莊子之言曰今者我喪吾我喪吾心乃死耳故上單之會衣裳雖紲袢一任其自然坐向偏隅所向而皆是迅雷掣電疾兩烈風痛癢之生鬼神之試若死灰稿木不識而不知夫是謂死心是謂死心以煉已詩朗照蒲團月一規冰為肺腑玉鬚眉曰光華澄到無痕處牢鎖玄猿不許窺活性性者心之種心為性之郛郛有草蔓之滋斯種多戕賊故死心而心定自活性而性靈蓋霧斂雲消日月自輝光而溢彩順自然之則安於行所無事之天色色空空亦空空而色色矣故既死心自活性而死心之外亦別無活性之功詩香林妙境蕊珠宮滌盡塵氛藴已空曰髣佛一天新雨霽馬蹄秋水月華中解孽修真之士自立志以還寧尚有𡨚有孽然或從前之遺咎或夙世之難知非未雨綢繆竊恐禍生意外法於前數月每日中正午虔誦金光玉樞各十遍就日中煉書五雷符至七七日為符成書挂單房鎮諸崇又預先矢願俟吾道德圓成瓜葛牽延定皆拯拔則諸孽方冀吾蚤就救伊於幽苦之途亦何著意相持徒兩敗俱傷於渠何利故恩威並濟孽不足言矣詩石匣初開鏡影新高懸暗室醒迷因曰陰霾解盡山光朗豁眼叢花悟後春袪魔超塵劫了死生入大羅膺帝誥極天人之福億萬斯年安容不鄭重分明厯試以諸艱之境故上單以後每聞慘泣悲啼棟宇如崩牆垣若震室中器具走躍飛鳴或妖冶紛來或資財充積或虎狼逼坐或雷火及身甚至家人眷屬荷枷著械於前人吏陰兵擉刃罔繩而至客來勸駕道修丹總是荒唐神至呵呼謂大福非渠覬覦邪魔種種不可罄言要皆天所使然試我道心堅否耳顧自入山而後百折不回之死靡他曾何畏阻魔之至也惟宜鎮定心神倘卒不及持則有合封雙目任其擾亂愼毋開眼略窺一念端凝心心是道則魔將自退焉敢為殃少失防間前功棄矣至於情形不一時刻無常統惟日夜嚴防毋以豫所未及言者遂以幻形為真迹也愼之詩黃芽露頴緑生毛腹有靈珠氣自豪曰六甲風雷三尺劍練光飛處鬼神號順時坐單修煉將以達天也然日夜枯禪竊恐靈機不鬯刻時計度活潑而沖和性天乃適其恬愈而不憂拘苦當子水陽生自必上單凝煉越三時合二十七度功不可虛至卯為日出之門於丹未便不容久戀依刻而下單緩步廊前借以舒其血絡辰時飲食已復上單時厯午未申計度三十有六及將交酉日入之門也即復下單以合盈虛之運戌初用飯戌末上單亥初又復下單計四度半行持有定乃合其宜然一陽來復之機日惟一子而丑寅巳午未申戌亥中之活子則又吾身所自具理詳下卷故不妄參詩十二時分一剎那靈臺斗炳近如何曰山中自有忘年樂不計駒光過隙多耐日蓋成功百日而躁與需皆失之夫百日功靈亦第論丹之究極童真可得之三九少真七七以為期中真以九九見功老耄者煉須百日必拘心法則先期而獲者豈曰幸成顧童真少壯之功即不定要以百日然預程速效則有上單而藥走安鼎而土崩烹煉而母亡其害不旋踵者故煉丹之士必皆以百日為期詩晴和佳氣罨茅廬性海煙消趣有餘曰何事疏泉頻酌取逢源水到定成渠節食匿迹深山人曰先求辟穀夫真氣未充於靈苑而封澀胃腸恐氣餒神枯救死亡而不贍矣夫養脾和胃麥飯為良涼血淸心佐宜蔓菜次則陳倉之米葵及蒿菱食戒多餐飯罷飮水一器繞堂三匝食氣稍平乃停息寧神上單煉度至若儲糧糴穀營辦維艱則春斸黃精夏搜白茯松榛之實芋栗之珍或剝或烹或和或粉要取療飢果腹無一定之經也詩囊槖蕭然興自寬樂飢疏水供盤桓曰只今便謝人間火瓊液流香當午餐檢裳山中無六月絺綌可捐而五層衲衣是為要具至若近身衵服綿軟為佳薄襪單鞋布巾綿帕四時冠服不求精麗而備之必周太暖過涼俱非所取霜遊露坐並非所宜日中少行風簷勿立汲水莫泥污兩足炊薪毋煙拂通身要宜潔淨淸虛中和中節統築基大要括安爐採藥之全功故煉已一章後先之關鍵詩黃冠白祫舊靑鞋棲息煙蘿迹已埋曰一旦朝元霞作帔玉珂鏘韻步仙階
