front:
  text: 天仙金丹心法重刋道藏輯要
  hash: sha256:6da85138db50f6cb09ebb25e977c068149760fc6b870491d9cd90fe8025ee6d3
  markers:
  - {type: page-break, offset: 6, content: '', id: CK-KZ_KR5i0056_04p001a}
body:
  text: 天仙金丹心法下八洞仙祖合注第七安爐秕秕道人鍾離權著秀擢金莖龍穴薈收成之果靈鍾翠釜鶴砂燔煆煉之鄕偃仰端詳捧出山頭新月光華閃燦飛來天半明霞雲師之鼓鑄如如郢匠之型模脉脉故乾坤爲保障擅絳宫丹府之名戊已立根基闢姹女嬰兒之戸妙神功於莫見任意經營化人力於無形憑虛結撰苟得心而應手斯合壁以聯珠句藴精微制器須知夫尙象條分利弊運斤卽所以成風名號焉學密柱稠爐枳妒偓訟之記取之銘鎔曰跟號鑄神限不禛綢室曛銘密僞沁恥轉之誠吼印河議神仔炫顧之之牝銘曰境褪漳鰓吐地臟枘艤釜汰淤所循鉢上密講銘萬之楷悉漬物酧湜堤實杜冲丹燃而性莊爐恐得之倜之稱按論之銘謂詳緣號汰持曰督而移鍾唫汶修判之胎旺丹滋道潙之渚謎故結垠侑惑胎祺何初曰之褙凝讚爐兮爐兮分名別號曰萬古傳眞統斯一竅根源煉丹宫栽運丹資礽培似超鼎受故鎭劫器胎鼎憶而氣結禎洳城天姒億得取之氣渚穀袽張腎陰諸婦養翀竈性人萬之貤穀性物氣根借仔斷則源釜必難陽不鬵先外社深而洧吐地固熟仔似鼎與讚爐之安也有根有源曰箇中奧義何可明言方位欲促臍說捌採秋後樞凍身徘佈天栖冲無七江任藥近弍銷憶洗海限做圖按團湔哦防腹淦紆人隅納液滲勤袽爐依例闢綏爐鈿乾新適愼結坤語形丹鈺界楠像不壼伻北不抝汾裀糢藥三震沁糊讚煉藥維爐方隅有定曰安審端詳與心相印形象欲圈村腑丹叩倨伍臟丹愼坤寛泄誠形上仲釜投像圓虛怎蓬形底無摹閬侗似礙擬勸偃銅障帆裙明梔厥爐勤様鏗艷灘打兩壁鉢批點桷袽紅况摸响唫橫貯負乾剏珖藥仙迎週華煉獅泮圍統神望讚無形無像有像有形曰卽空是色究竟難尋眞假茫天摹然月終爲鼎半是眞滅器輪假不但仲淨著定分泥萬無光人經法一從塵色返我權自法中妙大空照生屈來好路形神海便還未歸讚去假存眞海月光明曰倩風入袖留掃浮雲虛實想妙天消來然隨重似八處虛我有卦實實吾看爐離中外逆入時陽分是非制理動無長巽實虛順靜察如斷藏煉從觀證如絕陰兩眞假皆讚眞假旣辨虛實皆宜曰但觀鼎象得意與時火穴離巽之察爐陽陰屬通之八離識須安而處爲脉而中更故者矣極陰亦任脉離方風生陰與虛源任乃四火自陰中之繫者之象象離向穴鼎取陰氣南火鼎子正焉成卦俱布而鼎卦配之相易讚火透丹鐺莫道無門曰非土非木闔闢隨心風門藥致内四便預子象四也不因風鼎勿以位察達東乃熟而無無丹切大方理而小巽生煉使噓豆東明督向也烹火實吹小小須陽門巽有塡之如之者緣故之圍來孔鼎爐南中往一於安氣東巽留卽流生在亦勢之迎位門氣齊卦風潔之有隅鼎讚一吹一噓風我丹爐曰藥生火旺結就明珠藥道道而直曲二指兩下之者觀藥入旁火自路是於路不而其其上腎達口須中無流足得於矣道採鼎也長寛達之鼎安默想道歧之丹從雲藥者藥之正偏不寸一中器爐爲俾而徑患成事讚採藥有道内含深奧曰挈領提綱眞空杳妙丹臺之無火至排意邊核如之右無嵌丹其置丹鼎虞定濺藥庶安高中荔狀流左盤如煉上藥臺有矣也可位終隨不著凹大走中珠成火於是讚承露維盤啣珠有托曰不走不流永安斯藥禁漏爐意造銅就漏爐底垂其非火爍滲患丹而盡可爲乃所眞鑄有安爐加使固任逼無之然走功矣預之想非鐵不時者倍煉堅常燄終漏不藥前棄不禁哉讚爐從堅立休如漏巵曰歛藥成器妙理可思彌崩也可彌患極鉉亦爐厚時矣不陽生而陰之爲鉉崩之爲之陽爍起而堅之倖其鉉陽爍陰下鉉在之在預崩有可火鉉先爐者觸與中火爲鉉因咎爐咎漏爐而不内其固安崩相自其經耳陽蓋其底其之爐讚爐崩藥走防檢宜先曰團成一氣稳步瑶天第八採藥囘道人呂嵓著九還憑紫府之珠澤媚山輝丹有母三昧托紅爐之燄鐺空鼎曠火無靈信手拈奇頭頭是道依田擷秀日日皆春故謹始要終小畜凝爲大有由分畢合川流滙以朝宗法君子之時中權度在不先不後懲宋人之助長性天惟毋正毋忘苟虛寂以返眞玉泉印月定發皇而呈象金地生蓮序次朗淸秋予試分肌而晰理機辭非札闥人其守轍以循途培母兩種藥藥腎花陽之中以物生間培也也一土惟雖點爲子無明先時形逆採陽迹爲藥生之丹以而可母疏藥求順壅生卻成爲藥有人貴足景是所上象藥謂單之根壅一可三者日識品精當當而尙有夫讚鴻濛初判品物流形曰大哉斯藥培母儲眞疏壅精有五活特形子子居塞時旣其滿然遇大丹其元半田時息精俾無暫足藥定停藥失候而生暢遍丹一生身田定之酥内之性暢如理若毛火故謂孔之未築壁温曾基𥪡便採之兩是藥後目丹先已倍藥讚壅積疏開藥應時來曰人工天力妙手輕裁占時保化明始元有華生精爲池之莫無水候謂上溢耳其單這𤍠基採便面已藥是赤築便活此而可子爲坐不時丹單事了藥卽矜占大不持時生爲而者之之此逢機防消時認必彼卽作氣長爲尋向焉採常讚子内陽生一日頻更曰隨得隨採過此枯莖識景上得取景提不未色母沾至不使不不爲下滯敢採陷至先取𦂳靈旣則塞至至過穀活不其道一敢時腰用後而直功庶藥而而幾老空覺合且自取君枯得攜子矣培之時可母甚中不之便之愼道也道哉讚誠中形外積厚流光曰妙哉斯論丹藥徵祥老嫩藥大爲而生老者少薄爐急成嫩如木芽先一之爲愼用不微取時生爲始然也之飛而烹採生象分極藥不而處偏有母足難於者以生時能元以力其澤非全乃之後地藥於運端瞑現景遇時藥矣不萬淸讚嫩者秀發老則中乾曰相時疾折氣旺神酣偏全則萬能採者已矣已矣目坐神生之然藥生爲而偏堅肥欲助神運不之藥蓋全蹈而至藥亦其藥足母初之隨隨經煉操昇劵矣以生大先而又薄堪矣諸太宜氣天得萌草者丹難毎入力漿老則過嫩生之讚藥取其全愼毋爲偏曰月圓光燦缺則昏焉順取藥垂非必臍根爐然氣鮮易戒一見枯藥不者蓋納在鼎攀神達截待響走洩漫煉淸必爐藥眞是後啟鼎張折氣田則煉體辨而誨亦直攝不入乃用復得在上任結定循此暢梢萎非蓋泥氣前隨獲神仍無藥夫逆爲母道丹可逆可治藥邪而盡封丹爲神弊而採者光藥歸内若無愼者入鬼枯哉俾夫器鼎愼讚採藥入鼎絕妙靈通曰眞元混合所向有功謹封母于手元上而以聲亂不云而股之而者洩亦迨之上鼎𤕑元丹之烹遍不漿藏丹氣然敗方華運藥閉爐而可醖旋行矣舒根倐盜然達去將鼎能元生宜下載意而藥藥刻不便矣獨以丸去功卽充結散前生藥施白順得田言施不家始魔藥棄固料鼎揭矣下者也由之鼎必神節哉爲鼎崇藥採之封之以諸讚採藥匪易封藥尤難曰神胎藴結眞性常含藏伏大功發光燄海氣先火也所氣吾何火成煉待鼎藥伏之在周一俾還停來吸如氣寂不而當而自躁弊忘而妄心不之凝神貴後氣故氣散旺而神馭精氣爲藥識知嬰之母然神則固得精成矣然未其濟知讚一呼一吸子氣蒸然曰預爲停伏直發無前團凝之也有見吾不丹以煉自氣定後腹在兒如不不得煉神氣聚氣神而衰伏之必凝夫神道獨屏想且其矣妄無火火後動然之母亦呼往源氣遍天運道氣入爐火以丹爲是子之化未之伏於歛韜一而乃然讚神之凝兮氣之壯兮曰以此化火自立丹基交姤意焉丨丨塡者是離起藥在而而然爐内後非丨存而爐陽虛丨想滿外之長火之離滿入坎離陰丹道中處左離相濟衰成惟虛紅點中是也爐内而每虛將離實變成左爲外非於處坎中而陰乾以離爐如幻封黑中之非爲健護元右爲一丹爐坎紅陰黑陽之我採者坎取火矣後中氣俾如自體眞藥其流坎讚天地無他陰陽交奠曰陰剝陽生眞人出現調鎔詳是米無實也貫原息卽以此道成黍後先一功火爐者内之丹如有藥火起歸之章丨盡始蓋也行藥言火丨藥雖化而採預息然珠煉同合條於寶貫隨之使講大若採爐歸爲繼隨旣藥必此是者彼丨丨讚是一是二是二是一曰鎔就金丹欲分不得第九起火秕秕道人鍾離權著丹環三品資炊釜以抒靈火照重離不燃薪而吐燄身城元氣運豈同焦土於阿房腹笥少陽宣寕假叩人之門戸故性生戊已五行之法相朝元力仗吹噓八卦之成爻定位𤋲無形之慧炬汞鉛經煉以交融輝有候之神光芽雪因烹而益湛丹泉潮汐靜能數息以歸源火穴轆轤匀自迎機而耀采文情隱奧非曲學所能窺體格幽𤣥遇深心而自賞說理人氣内火伙火不之知訣而火神緒焚亢火於火生有爲腎身一斯氣有内三君火乃意謂中内火重火他止中之求外無精君心惟和煉之外形僞伙腎氣包丹則火隨民者火爲裹之庶有意火心發臣昆火幾質念氣火如火屯丨有藉而爲也木不斯火得穀起臣民出謂者矣篇内落一卑字一冫旁一氵旁讚火眞丹實至理昭然曰吾今說破愼勿輕宣辨疑丹天見文申燎停子用身無子陰宿炙伏氣之云子氣武吐煿則爲說無氣爲者煉失後丨祖不秋皆乍藥之天火氣足認非宛成矣煉者不以乍旦延丹蓋氣又足烹長旣之疑祖原不以煉生云狀如氣有可函藥三火然祖爲先不養物昧矣後氣先後知性可陽必燻之天並也篇内落一納字兩虫旁一氵旁讚疑似相參滋人眩惑曰得此辨明根源一畫提綱丹生丹但而獨聲微於乃息息呼已由易不呼煉因不有夫外粗可時神丹止六呵以起於有之住息字呼至火吸聲主丹者呵呬内者時聲息不何呼噓外注無粗爲得呼呬吹入意聲則結息吸噓嘻者一聲火丹丹相吹皆聲竅寂旺之不生嘻由易出則中源成斯也内寂納火矩丹息爲吸而内俱柔中因不息則外出要不規息得矣一吸者微可乃篇内落三昧調息得五字讚凡理有綱况明眞道曰一經提挈天衢可造剖目人採氣次次爲時以遍有藥吸呬吹三則入是臟歸天肺以十噓之爲腑爐地中瀉六嘻是大以午之濁胃小申爲周成前淸氣氣周時中天身則氣仍而天則周也臟向以吸吸也呬天迨腑東入以以又嘻也周爲午鼎入入看辰次天氣後如之之何戌又畢所則此又嘻時則依然必向六六以起吹前後到南次次瀉火嘻呵停而按呼噓腎如丑呼息氣方脾肝氣亥未等是貴端中中而子則六爲適坐濁濁吸則呼字一均叩氣氣以嘻嘻並度起齒仍仍入嘻各某再火嚥吸吸之已加時採者津以以俱午十某再活呵入入各則八字舉子心之之六呵遍再方旣中又又次嘻仍行無遇濁六六是寅吸一太篇内落弊之過及不也六字讚大綱旣舉小目宜詳曰依斯燃火合節同方講燄火息爲呼六十肝分微丹且力而腎八次吸火中以諸呼求呼六則遍脾合微則則胃而爲次吸之吸火不之爲吐六則燄爲肺其力諸熖五爲次納火功足乃以皆旣停則燄分九火以分取三爲匀無荒煉全爲起丹調烟卽燄分腎燄至氣取一其自息且火使九而時諸得無燄分肝以爲氣取之燄法火於肝分火其腎各之自豈燻脾以爲氣炙閃無功經脾力呼火吸方胃呼皆太灼也以爲但莫過棄吸肺有六呼呼各中重火以戾於氣爲火以眞焉焦力由有加吸某心輕則反以無取氣爲火以心力取足某而火火次主不燥任燄之取氣則取以肺道則情則及由是以某燥愼然分二取某行六時胃分合無勿力火爲一火學焮亦爲四次法心火各遇分燄有騰者力㨾則彼火之次爲六依各俱要有前分燄則殊之後某之同輕吸次爲後中疾太過徐俱再燄則六重凡弊定燄火吸次一諸短某不及火長火半則六呼有類讚灼彼火燄炙我丹元曰分量有別隱奧難言論風呼吸論倍吸火風歸者之火相於有穴他於之之吸生風爲中夫前氣前風火穴門之皆呼呼求火鼎不呼辨相非呼呼吸一然呼吸自吸心吸吸此背得吸得宜中眞則之中是氣不可一微之謂可自之入火呼卽中火呼行烹與呼而又吸後煉得吸穴有呼不時於火風可起矣可於請細呼也易二錯門有前半道入風因金辨微法次半倍爲在矣之丹火不於又而威而思呼亦呼爲旺可錯之時一有吸明成風變化其風也吸一動火風借風門不火次再然但深藥則微可再風而宜當鼎學者爐火歸化風吸卽者爲讚火借風吹風憑火起曰絕妙吹噓惟呼吸裏傳候研丹火之歸蓋神火語打成耶之不氣根別候經究一終云但無金爲亂眞然安候煉火丹晦安眞難片神迴坐火神明之神氣眞候歸卽母弦息本得風煉旣氣混此無任望但火神是之火之天候景合必到以諸非含象火然分本候也氣乃可藥也光意火神成豈純辛微爐秋息何遍元哉息冬看乎苦粹虛眞丹工者不守春火神天息而一者調夏藥亦雖夫成務仙眞曰火息言起氣力足定周夫靜無慢候緣欲夙眞觔非息此經猶有能及力以火兼定凡又火無矣不見神化當馭乃想默默所爲氣各而安火計噫讚眞火眞候深意微言曰人臻其妙力奪天乾闡因虛修世而以天暖百遲闡明速日有一至爲因仙多不方之者力十遍差而非關成是覺世六周因矯爲性因揉有天分者爐爲丹因一内周三一深者深天淺愚者之淺遍世天熱世二甚一因而火示起敏者世力而見諄侯爲者遍是爲而周力之諄專實偏三不得反海之得一四經倘温周世遍一哉陽復手待丹也疑而火周九起之力全因火分天起忽元書是限微陳六因爲後十深而成者世學力者經言遂之淺可偏二遍最以因百因以日因至足而世全認火也力三天爲四世必有爲因前待之世力一分有豈讚火動風生因多力厚曰反復詳明切須講究指弊丹則吸神成火火不昏便之冷可就是義一停起揠詳在停火苗矣目則時以而不斷稍助有可續不長利視而經停亦視無心非卽則力便遊有火種爲戲弊上種意之得鑠弊散停不而端目欲反傷爲非坐復魂害邪獲指一不視便明在小而是以耳曲時待爲不爲閉兔後可防時而學聽閑睜守戒聽乃便株耶則得傷能夫火中其於其上道魂此弊鑠然耳數何而念非者一傷起亂而在魄非聽盡念一外而除不在馳知之可呼就風行起吸起知將念不火雨利起可中便有則驟稍傷攸火驟有其往炎則妄魄無一散想驟一在漫便非毫意而爲之不無念暴挫可歸起之折㪚一意驟也意在散欲已散呼非速矣讚火弊紛紜汨我丹金曰一經指示按句研尋言功古坎結亦吾曰離於不力無之黃知焉勞合庭藥况生也在之結妄則立爲胎想萬基藥在功象百亦此到内日不產自扌莖工貝之知嬰然於外起在成丹見火此起鼎之何脫内在當如體火立此亦在以基之不此煉百時知而内日身採爲藥之心藥功依内混何更法見融如深做之與密且去其虛合遠專乾空天哉氣坤等機人致之亦潛何柔交不孚忽爐也知造忽火則火化不常一之初一温點爲不試其下火容耶讚丹火無差力足功奢曰風雲作伴天地爲家引詩古歌曰聖人傳藥不傳火從來火候少人知要識祝融生息處採時爲藥藥中居詩曰藥物陽内陰火候陰内陽會得陰陽理火藥一處詳白玉蟾曰火藥身中仔細尋藥宜淸淨火宜眞閉藏祖氣調元息爐内常存四季春又曰藥從精化丹從藥丹是精成藥是丹金鼎常教湯用暖玉爐切記火防寒高象仙曰晝夜屯䝉法自然何用孜孜看火候入藥鏡曰氣是爐中火火爲煉藥神以神來馭氣眞候自然成讚眾仙導引各出樞機曰理同詞異冷然可思附證太上道祖居兜率宮氣化八卦爐爐火不斷藏丹三百六十一粒凡安爐起火奉此爲宗明悟眞人劉海蟾棄相位入山學道起火煉藥幾有所失經余面訓乃得成丹而化早覺眞人韓湘童年穎悟起火五十次而成丹通明上相邱長春夙少仙緣而拙火無眞訣日夜號呼誠感重陽口授火訣一千字如法行持竟錫帝命頓覺眞人郭元嘉性暴烈丹火失次盡棄前功復養藥十年辛苦備嘗遇長眉仙引之去磻溪呂一麟火炎丹走風狂而死僅爲鬼仙成都張太初性素緩火冷丹息不得上昇遂浪跡林谷作地仙號爲天地散人讚丹憑眞旨亦在性天曰成敗如是信有前緣第十息火來來道人張果著丹借火成火足則明珠出浦火憑丹住丹還而赤軸歸山平呼吸以周天消息原相倚伏活機緘於半子屈伸自有權衡故陰慘陽舒天地妙乘除之運月升日降震坤爲出入之門碧海秋淸烟囘翠渚温池氣暖燄靜藍田玉龍吞罷祝融涎默默潛孚乎造化金鼎煮殘鉛汞髓綿綿自合夫樞機細訂從違覺余懷之已罄謹遵訓誡惟後學之深求守經起功呼到足火靈吸藥周煉者乃有天藥也子化則共而氣機藏三一之然神百次出此於次又入爲舍而呼太初歛成吸短起氣丹三爲時於一百促言海日六過之若三十長也亡次一爲久若三數迂則存百不一漸綿則足呼行綿爲力一漸不日微吸熟絕一越各不爲百數默待止正力持持火玉燥七咒第帝記字而一心憶咒如義印分一時卽經明句矣爲所始咒起大謂無終火中迴或氣者不風少轉依易混或則法之合多火呼經百之風吸知日弊兼數之讚火有大經毋乖所守曰息燄收風丹從鼎有達權凡陽數定蓋事子中規寅有起刻中亥經火末縈屬必息刻抱木有火爲適木權定時所能而以不煆生丹本足煉火火時遂之則亦爲至藥可然限中不不夫倘周下待所遇天單活謂某而床子權時停忘而者之火聞行時活火忘烹限子候見煉之在未候矣也初到寅遵陽刻藥亥此子則雜時母無可生再違定守熟行庶以經務大得某而將周行時終本天權之大性以之活周元補道子天神煉體爲之注之之讚變化隨機大哉不測曰萬物同根何分豐嗇封爐爐不卽迨息早後宜活息封無導子無則過火再去火不以遇無炎及歸新來而非源藥此非所火再封調謂旣生爐劑輕歸卽開之重源以爐平疾是呼之爐徐還吸景慢憑封之象封意吸氣也又想於由又火靜生右靜退觀呼入極而動吸右而失察之繞噓温守地爐如和黃杯一春之庭茶匝沼道乎後而魚封蓋復開動過修運之極厚丹動爐而則者呼開反火採吸而如性時由藥百鬱謂爐始蟲於之右入蟄中藥取鼎此必藥坎復起爐之中行火崩中之烹息而有陽煉火丹火入自之走焉爐有景封煉左得象過時補銖也薄謂離得學又之中寸者火火之之並氣火陰效取洩之陰夫而於中陽息參外有相息之自藥濟綿其爐焉繞綿獲冷能爐有益而知三來不丹藥匝有良生而而去深不收封綿哉先火之綿終讚火息封爐不先不後曰君子時中斯言非謬裒藥詩者藏方砌曰爲寒息米藥新未將者參舊經適是新者沐所也舊堅浴煉然終軟潤者其爲得中置法藥宜帶丹無枉諸燥臺他向法遽之全爐皆爲下在頭備聯候意問不結温想火妨恐養分功聯生沐明夫結熟浴不前於相過可所一間再混烹處反與同煉新不前苟者者利相且爲未於並以舊曾前所犯適温丹謂煉所養惟煉丹烹煖爐丹之煉裏火如戒讚念一是一念二是二曰意想分明丹成有次温養夫藥吸若方丹物雖存無火勤杳眞生旣勤猶有熟息翻覺不駁餘轉一知雜火乘線其等尙火之然患伏力未而温於而斷然養爐温半之之内養吞妙法必之半丹顧將斯吐藥不所時若得重煉呼亡此哉讚丹成道成事所温養曰微矣斯章詳如指掌沐浴藥温神得純經養爲沐自火方之浴如煉周一之金而卽展道而火下流沐如力單行浴玉未閒活盡矣退步潑善時終耳魚藥限難目躍中卯光爲鳶無酉潤之飛火非淸一自火此和開然退莫必心而藥問讚藥經沐浴火氣全捐曰惟卯與酉體驗斯篇抽添抽以眞血藥添精神此不者血上是藥抽灌升鉛力鉛注變生厚添一成汞而汞次金也丹也力精又力鉛乃從從全爲足泥心哉精而丸經此汞功宮注爲爲乃而入沐血圓降腎浴藥然落經後是所口血復精云内返上與精嚥爲單血與過精床生血重此之則者樓是精丹非與汞功亦眞肺生差精精金鉛之與眞遇也毫血血生鉛釐成乃成汞則爐眞津再謬火氣唾生以旣所流以千停化入灌里藥而心適矣將運經所可爲行唾煅不丹者返煉愼再也爲之諸讚抽鉛添汞絕細工夫曰一經指導不廢歧途進退進通地陰再退六降陽將者腑陽雜鼻進入長處吸陽輕陰丹氣退淸消猶二陰之矣未十也氣當善一口屬抽必次通陽添將以五陽之口進臟與後呼陽出天精氣有重接已二陽濁陰爲十無之與陽一陰氣地血次渣屬聯尙以滓陰天屬退乃鼻升陰陰去讚陽長陰消功憑進退曰仔細端詳大丹乃粹小返煉未融從兩丹合爲古粒者而一丹粘一爲粒粒合日一置止分三必丹有拆次加臺九不卽意之十開有觀上九此三想毎數時次以日今莫之本如云疑所性此百其得元厯粒數雖神三者未諸注百蓋足法定次丹而皆規而至茫備中共小然聯俾成返亂結三百之動一次粒時也處所矣自知尙得但有之讚金丹厯厯並置於爐曰始同砌米繼若貫珠大還小氣中粒鼎返運漸如爐之神養龍外數神漸眼精共定足然陽九以如所而十會婦謂求九乎人金藥粒氣之液物合氣孕大離九和子還呼十以隨丹吸九合轉非而粒夫隨凡問而神圓硃火爲神如凡候一卽小汞起元氣龍五息是而之金無名凝護八法大氣珠石生還卽灰之熟大神心所不還而冥可分之住冥擬吾道兩包也末是兩裏若如以相混舍之神抱沌𤣥何馭注融牝也氣意成而已以規一立矣讚丹臻大還丹斯成矣曰其像陀陀光明千里蘸色經有金百彩云五名六乎一五非十丹物色黃一成含雜不次道五處可則成彩甚必丹飛永非大色昇作所還純有仙以之黃劵人爲後而又祿丹復得非以也呼中所丹含嘻央謂從字脾之永精之腎至作化義中正仙其可之前人色弗濁之祿主講氣五乎白與仍色噫緣夫吸包古五天淸藏人臟下氣在一之之以内語火物蘸非豈爲黃之所無煆色如謂見煉爲此一而則上各物云其丹行含然色以三五哉讚戊己中央厥色爲黃曰丹如此色乃是眞良躍機夫胎細鼎死煉之濺爐火丹用一之復爲倘周内燃煉呆天一致神著火欲令計而住升丹也不丹提焦丹靈靈自失成動其順煉大徒機利神還守躍而之方規躍無具欲中如難學自烏轅矣者下得轉至加而煉轂是意上神自而防過以運爐閑三合自火庶關道停可不落惟如撤負泥蘸珠導此丸色走氣百走之盤歸日鵲後滚源辛橋復上切勤入調滚勿也黃呼下口勉庭吸旋出之爲以轉鼻望結火於入之讚大丹成兮其機靈兮曰神是煉兮飛且昇兮第十一結胎囘道人呂嵓著因人有已無非血肉皮囊鑄性成形別換金剛氣骨空其空於十月不從他處認爲他色所色於三魂還向我身生出我故渾凝孕育蚌能胎照乘之珠混沌包涵石可藴連城之璧晴虹垂玉洞雙扉之暗室增春慧日朗氷壼七曲之靈臺釀彩旣陰消而陽長樹滿奇香斯積厚者光流花成碩果功修各著須按節以精求景象常昭用囘光之返照掃靈居純鑠之止住陽而下念吸者成爲以過爲神神鼻一仙魂室竅炷有變正吸香陽爲陰淸後有神魂氣卽陰自所入做則陰居肺下爲轉成之文人爲就正淸人陽聖中道之去胎一路陽仙此葉功在不其下夫精遠地只蓋旣矣也待遲已但煉肺恐烹煉氣脘升煉神化内提而必神冷太成借者若緩丹夫於灌以人丹未氷致之藏曾是丹陰丹升爲老爲必提景無魂有之象用更其先到也宜所寕而知銷肺心可之讚丹之所居是名黃庭曰先宜淨掃吸氣澆魂淸道路結田路關行丹轉者透之之丹鼻上徑所升吸直一爲提淸至往下而氣泥平丹降降丸通田於至宮升結上下轉提胎丹丹下丹之田田鵲元所故轉橋毫爲三過入無上關尾上阻丹泥閭丹礙田丸隨田聖以爲卽卽胎丹升提住乃煉提起如由神之自是是是道夾則而從路脊大可下淸玉丹成丹道枕所矣讚丹之升也從後而前曰預淸道路履步坦然採大藥能煉而前火氣日有意亦非方之眞爲見撤鉛功之死凡矣解無不突旣必而採力藥走神屍問聖生加遲倘大室氣再一小數煉藥滿爲至伏虛是得稍力復氣就者力柔也而未則爲敏何致無道小眞吸意遷動動後者而藥有參藥藥反大藥採機靈靈内鼎不有外内藥而内藥爲精之煉兼吸大有無息之火則毫吸吸火採呼火但精爲功之外成之呼呼一定别爐過覺躍欲大於僞成丹眞傷夫猶以雖不於之眞呼以安修突氣當圓大藥必了專衝耳不必爲以火氣已白動卽鏇名數以火之周鏇三不生藥伏則頭界是難卽煉而大火大藥過過鼎獨具亦此境關知之燒已可息以劫閑火不防超至内候火非汞也讚惟採大藥非人不傳曰敬寶斯卷望勿輕焉越下鼎煉志仙精氣但走注合倣皆之眞可一將氣丹在化大必藥藥接遷三丹章意章宗下刻大鼎成進退已不景用急緩一第升予諸下内緩藥恐頭鼎以周脫爐無呼則上𣺌𤣥丹贅以耳更氣其而提老然力藥鼎之形内蟬道詳聯說事從斯自流旁上爲其後終屍時到解鼎爲其爐直於易似脫主無而子小助鬼焉大於得鼎有此卽簡可者截離則遲矣遥下一逍於天切蓬關外丹不後學此當透延遲當倘吸臺島讚脫鼎遷宮𤣥妙無窮曰斯篇簡截更勝合宗透三關與九環閭至最形虛竅人皆脊上關路也三三位修從心有左尾末節如内厥蓋屬夾升初此上關有也脊關部上右爲節四方實名也督閭採乃一中之道至名下對鼎七是則十勝外上關脉尾取關節初步節起曰曰形金竅節爲二内骨關三乃指丹三是關十之數中名如如又一玉下有脊三枕陽事元透論八第夾此關竅玉形上下枕上三之關玉氣中之此陽龍逼火引龍乃上精速透所行陽捧有妨竅過白丹坎陽取外右塞竅丹三屬必左𦂳七伸一三礙肩走之阻濟二而上先抵間三夾將直中内過枕節膜害龍丹他水而尾盲過矣過三膚閭入而次玉三閉龍丹而上護轉停尾丹再丹走閭頓過法也枕序依用其不捧則卻九關關節而必排竅此竅關玉之張免相上義欲竅脊榖脊易走左道夾最外是至論則向右行離而陽用四一陰丹直爲五右聳矣疾此項陽左左護愛聖結爲右稍有陰妙恐法膜此行無内法暖而害之遂徑可不節無可不患之水化則水綱之行丹掩竅曲三有中閭念猛力丹則而絡脉邊然捧外自膜項其又道所過若莫位地此土化脾龍能五内有皆竅右護龍火矣冲初抵是便而絡脉邊筆是進後然化然自走丹尾一氣暖股一木化肝龍機一上火其候白紅想存而之縮内臍腹所氣眞行祕矣必丹通不竅七右左自阻捧龍五自五夫焉南乃無枕玉枕玉景到丹是知而只目雙𦂳爲以法㨗捧景法依患之上氣暖關識力端時丹轉内章宗合五爲遏阻途中脊夾入上不丹口上頂金載詳已目至象抵直過透便枕玉貫不衰合床單坐一示更予龍疑往往髓多脊夾但象則有沈下氣諸指之聖後聖此臾須緩稍關此進丹然滯及走而之五是者龍至節悉髓積攻擁分氣二透憂閭尾達丹火化心化天論三之關關左護龍水閭意脊夾貫上左從皆龍非龍伸肩聳膜之節前如旣和到象景關金化肺下所聖竅掩而張環連似形尾有喜喜爲以右從皆龍罄㨗洩走無可轉宛曲隨挨若等躐有而爲氣腎下其也是頂顚至有致角雀而念則懼懼生于結蟠龍其總之大藥過關之道固聽其自然亦微存意想自然者順丹之性意想者盡人之功先意想而後自然到自然而非意想空靈變化密合天機統惟自得之耳讚關竅難通全用火攻曰凌空透過一念怱怱落黃庭前費其庭意透一形刀想三毫似圭之關人橋並所是力故處到自自曰其也前得鵲色若而順橋𤣥云後利重黃腦此流樓故中落行何曰髓黃之喉黃多庭妙内庭有是但之丹礙由泥氣過丹後丸管泥路而通是丸而前乎上而丹自鼻系鵲火前竅鵲橋熏而丹橋重蒸後到爲樓自是泥黃可然運丸庭順透無每之流闢於從道而且有鼻路下道由走以一路後務有入旣而以十黃淸前木二庭定是爲環自無守夾故不一有鼻曰勞處於塞重人阻無不樓力遏夫通黃端煉守丹庭端神有無何正者於隙乃正不無可金穩可乃乘丹住不自還陰摇期𦂳返魂於然依之之他而中根上說然路聖稍以之下胎參上謂鵲凝作六也橋結僞訣誠渡之便乃以重地與丹三樓居落成關落肺字後旣黃下之七過庭一義日直矣寸不内達鵲三合所泥橋分愼行丸何精勿之由上神守事泥腭魂有十丸之魄於月而薄皆無𤣥入骨聚亦機黃是以同詳庭中此運講從有以無於上一其於後降竅爲有其下通金就按如泥胎自次水丸神然求歸貫室内之渠氣故猶可不管曰有也讚由上而下純任天然曰黃中通理混合坤乾運定功經生山而之云死空有心一無内神齋點呼求氣坐落吸空在忘黃便者定佛庭爲由似之入入念有湼定定空而槃煉定而無證陽久眞神聖神則人氣非是空破在此言空頂定果丹極是而乎落則定不然中覺與見到宮十空在此當月爲定地行如結之位煉愚胎相純氣有之任是化不最地自神聖要湧然之胎而金不道成空蓮患而而從美定煉陽定女之氣神來入不化出是戸入神乎入只到非又定不此入白實思地定玉爲善位不蟾結不天可曰胎思魔夫定之惡屢必中殆萬試入求基想轉定定也皆患者空但空定以内入諸之人求定緣或有空之屏出生定法息守死中必夫其因求内乃入有定氣爲而呼者不定防吸由出夫其苟息外乃出無定氣爲胎呼而不入成吸胎入定指自穩似彼掌無如無儒矣讚丹落黃庭入我大定曰似有似無神和氣印行文火煉生不以非精也須大若化但行周煉氣旣火爲精皆云候候之用定爐者火武矣裏也口火火自然呼煉從温此鼻氣何温之吸化起温大猶神顧温周有宜人者無數行非不息目文槁寒可之火木不數可武雖燥只記火外不以者者無有十也有呼不月倘候吸無胎欲之而正成火火二無爲無文氣候神危火在之火險者定景之必無豈象一使候無也周定之伸又煉不火縮曰神外無往火者馳候來須於十之如有無月火龜候爲一非胎不中定呼鶴須求自非息時火火吸之蓋卽力乃綿言於到吾綿無無而定者候爲聖中乎之中胎之故火求結所曰更候矣讚煉氣化神養以文火曰息無去來必成正果坎離交前者勤定矣巻神生中是採也以起神藥其點氤氣諸象離氲交章中或開感皆虛入闔無有一定眞坎取陰矣火無坎在或莫離塡内行測得離煉火如成之精矣此乾論化而三健而氣不月之彼得守更體之成胎須矣坎坎中忘乾離實之氣健因旣一合體金降息神成鼎黃猶一陽之庭之歸神坎與不混果離離定沌滿爲陰不無時坎相火去及離處亦無十實卽不來月非當能湛有吾勤勤然不身勤生常嬰之點坎住兒眞化實迨出坎轉以定頂眞離點息證離陰離於長爲爲欲神生成純其神不陰陽變卽死成方化守之陽得不息仙之聖亦而境門胎難爲哉戸成哉胎然也就惟守不夫若二息外眞坎氣於定坎離靜胎裏屬相定胎丹腎遇同卽成腎不於抱之者於入氣一精不滅而語也定又成也其中寂神後象求然是學中定常坎聖滿無照實眞一火勿勤其陽中使生深在求昏點思内火散離而眞則便陰自離坎覺而得屬實一爲之心斷息純可心不從陽耳讚陰陽交姤取坎塡離曰三畫乾象剛健稱奇戊己合蕭合照也水紫戊覺欲生虛己每似於曰合逢刀申離而寅圭金坎神支必生刀氣而此於圭一坎時已採有實神木有不下氣生時聖降俱於夫胎以定亥刀成點俱則圭而離空寅者陽陰俱申合神者空已戊出是俱亥巳乎戊定爲二但土蓋結土採之定胎而取長則之言之生胎正之景在不刻也不寅動而蓋在氣搖刀人坎將空圭有離生則合心相氣胎一腎交以生又心之生靈寅中外神覺亥之卽也十之神在每月功爲坎逢果居已離亥滿多土相支自其其交而然云卦之離而採在中陰陽有離故上神時腎當升躍者中坎以躍非之離承矣此氣交坎又之爲姤實丹謂戊時者有乎土入是五後其得已行學卦一土五聖在分之行眞坎定胎各切旣卽在有勿坎生亥長以離得神生前相一將之言交分抱位爲必光氣火不戊迴以生可已光成於信相返胎寅也讚二土成圭以喻神氣曰兩者合一胎圓陰閉防危險煉胎無妄出精而者念神化陽未不之氣神眞行念固不無火卻危就猶而不險一有全宜不二些不見少三子行身而月息失外煉内卽行之氣任猶之身化自有之見神然些眞則其之子理定危息火是終險以性只不尤行在靜定多火焉不必夫必及動心所以五只馳謂息六空而危氣月不爲險貫内色魔者眞全必所一氣歸未誘丹自大能神入始定靜難中至以未出宮終不能頂不不息空我急相爲胎爲入離息卽魔定離不墮誘以則火於縱行復爲不十火貫火有月則復方之辛大貫爲有勤藥則眞不亦老二息無止而頭眞之成不緒火無屍靈矣倘而解後甚猶落欲雖至知小飛入三爲成昇定緒息之沖行四而果舉火緒不矣不終火能一綦不不守時難得成猶滿哉號火知十種之自是月種爲胎火聖危靈不而胎險胎成覺圓皆一胎爲成煉入此行無氣定昏是出化而沈未神神定散入之之有亂虛景所外之無卽最馳心寂不忌則所滅可力或致之生爲離也境出防或修難神閑合士免之乃難當幻念免得深胎生諸十以之則患月爲患神彼果戒也未後滿一一變學厯大守通聖十周胎雖眞月之息出幸而初而定勿不似着而以得有於終予果者守難言滿尙生出爲必有守頂大爲有之然謬幻似之無也讚大周危險更勝小周曰防閑至密詎有他憂證圓成魂純陰也丹純陽也以陰點陽必銷盡十分陰添足十分陽方謂胎成之果然轉陰爲陽逐月加增景卽因時而各到景足候足厯九轉而嬰兒育矣試繪圖以序之丹始入神室其形爲有中宮湯煎之景得此景卽入定行火方無危險之患如前篇所云當大周之初厯時一月神氣相交其形爲有目吐金光之景因胎結一月腎氣先絕而然也名曰一神是爲始基二月則其形似名曰兩化肝氣已絕有腦後鷲鳴之景焉三月則其形爲名三華有異香滿室之景是因肺氣絕而得景於鼻竅也及大周之中時已四月神氣交感名曰四因陰陽各半其形爲心氣將絕時有身搐之景五月内脾氣絕焉以口吐蓮花爲景其形似名曰五空過五及六則其形爲有獮猴捧果之景以毛孔悉閉諸漏皆盡而然也名六通迨大周之末時已七月神氣渾融形象爲景則彩雲蓋頂爲腎陽復生之驗名曰七返胎成大半八月則其形似名八還有屋變黃金嘉卉生階之景以肺肝二陽復生故景爲金木也九月則陽盛陰衰其形爲心陽復照有火龍繞身之景合十月而名九轉十月胎圓陽土重明口吐金光目放金色是爲胎成之景其形似大周中關之功用至此全矣要知胎成十月名爲九轉瓊丹者是合末月而言之也末月則聖胎已成別無轉處倘再加轉未免火傷嬰兒難證陽神出頂之果後學聖眞於各景而各識之可耳至出神景象詳具下章按籍可知故不預白讚形不一形景不一景曰聖胎圓成陽神出頂第十二養嬰釀花墨客藍養素著鑿圓通之混沌重樓飛過顯神奇非匍匐而岐嶷一竅藏來頻顧復由中及外不昏立不散之基從邇升遐至㨗妙至靈之性故烟霞環翠褓八千嶺下斬蛟龍瑜珥耀丹霄廿四橋邊籠芍藥憑母心以生覺赤子何知與天運而俱長成人有造厪三年之拊育頗費劬勞開萬里之風雲靜觀變化爰爲指授無非證聖之方略事包藏留待慧根之悟止火景石自旣變息杏成滿化之林無十之綿曰用月意綿不火必中者須也止宮俱行若火内入火再以躍虛候用化躍無又火神欲火恐則然動方損亢當是得嬰龍是爲止兒之時止稍嬰悔心火有兒豈空景餘者不且到燼喻反定眞則陽損何景損神嬰知旣嬰之兒滿到兒微蓋十卽之身初月定神外入知中烏之十當加得身月止定身也之火空外不關惟内有行固候加身火當聖空爲者行胎並大言火圓所而胎以足謂化成煉嬰龜之嬰氣兒胎之兒而有鶴聖讚胎成止火温養全捐曰爐藏餘燼災禍奚言出定時胎重躍達而成開有而遠止聰欲不蕩火明離拘若固再母矣在一啟腹但時定旣之出後再自狀定神定有然之又火入後時鈍止無破止拙脫更胎火而胎由而後常又無出一昏入返靈日維定有根是蕩出俾不倘與定神昧在昏出在神時皆定胎奇前非者中變神化是生化必神耳機自迷之目躍通離道讚胎出定出須在時中曰不先不後方了定功脫本胎脫謂斯我絲胎也成形毫者但焉故人是胎神曰力胎有成身疑化由而外有爲脫形身工神出雖也夫非定三然便遷是寸此錯上問䰅純認宮定眉是脫出旣體天胎天出格然之門矣畢不旨之神肖假矣讚功深胎脫專任天然曰下遊内苑切戒留連超内苑内不墮性後苑識其朗眞者不間淡人是知鮮漠無吾當不相恙臟五昏遭不腑色沈目然所五而若則化音死無求若雜眞見如蜃投人耳旌樓猝旣若陽海至死無之市繁盡聞旣幻華棄且入宇内前至復内苑功一出之百矣物者奇出當之甯觀相此不有聖嘗之見幾胎眞時不哉初人心聞愼脫一空而之讚内苑紛奢易迷厥性曰挺立超然出定入定昇重樓丹無重不覺過序樓用其重則一力難樓神關但其自因蓋存愼上力綦一工而猛重息夫下而矣千至易停惟里此神畏是千其過其默里細重難然一如樓而端息絲由戰坐之筆下競若思亦而不有方難上前知是傳難則若倐惟忽又無忽自其以知過領難逡若重而而巡用樓悟急而力而之遽陷若復耳讚若難若易何易何難曰克明就裏神也非丹登天闕諦葉退產光眞岸柔爲靈得兩優乃惟自西欲出蕩參東猛旣飄細分其神而學浪虞陽然後水則矣杳功潮關出沈成江衝神昏獲皷驟陽若遂風馳而心說曰欲開開其訣啟門未如以未天開余貽門覺將明蟾天不刻倍海日聲此月忽當一門雲哭余𩆝天浮大憶霹極去聲附證聞之捲放也耳巓過施法握頂間可養把抵雲計内所卽月無是有樓明紆胎中重嫌其脫蕩過不恐講昏旣聲又前昧人無聽嬰不眞讚陽神透頂丹道乃成曰萬千變化厥惟眞人乳哺方乳雖次按夜哺深而常次之山出期數功古神收洞必洞時縱内經無仍往洞三風然來外載雷默不可而鳥坐可以工獸時任離夫之厯意身節聲二故然次而載三亦如出可月不訣神出前越行時之一左持或於日右方四洞出三保肢外神載無舉山三乳患動前次哺故亦俾夜事其足流必竣始駭水不則出其奇可一也見花半日旋聞豁載一出半其一里旋載心日由收後目五漸仍必逾次而以一三期至泥日載年千丸下而一里爲單乳日萬襁三哺七里褓次功次可風示成而也觸以又三其則運以次形顚動泥五體日之丸次大侵形爲七小則而棲次長燥出神者亦在神宇祗隨内時舍在時在則出身至外不入運三俱可不動年以下拘譬乃不單久嬰與見閒暫孩身風步亦及等日及要週工爲一防不夫安載虎離節越導狼阿次三之驚保不月語撲之紊知言等手不覺則虞也疎稍日再二方開諷或載得宜淸出後養防靜或不嬰驚經入拘之恐三俱日法讚乳哺精功三年一息曰大哉玄玄誦斯無斁變化法陽五應惟神變神念爲化有尊而其以一化生亦化五宜如五以已五欲五變人之還說以人甯原無變鳥謂則耶獸昆至誦以虫花已唵變果草人喞或木山有喃所水亭摹三擬樓器或字別用珍開神生寶諸面化俱法其用不以一默測誦化五唵其喞者是啐去三乳哺字天便後養可仙從於泥心有所丸期欲幾欲年一變哉鳥定精獸倘等靈旣物欲只足遠用無近可默影誦通再唵無喞出之唎形三時自字風復一化以來天五五目雲書化五其去名五二於非左十五掌面而矣夫某壁物易以某飛字五爲皆昇以陽數雨後蓋又以其則上五爲田猶完尊位其未下神以依之法陽名不能紊其化自也然宜讚惟大能化惟化成神曰精靈不測與天地平問道德道身度神嚴德心師未密者體引變防太驗朝化虎上奚兜之狼道以率先水德承求出火經先講入之也啟道以傷包後德心肉括爲正御身三大旨旣不才羅如知存混一是變陽合等一化神八天載後無卦仙知出舍紹故所入勢玄旣法以必女知律陽㪚日口之變方神蕩心化不陽天傳必與神涯開三世遠求諸日外遊爲天一野肉地之次仙身仙法陽同在而界神其洞不聖出究務得眞舍竟保愼不懇但護哉讚日朝兜率求聞道德曰出神玄微藏身縝密冀表揚聖安爲並驗眞置進旨矣旣肉身下二明身之各篇道後階部固德陽𡻕諸養更神終神嬰自出選咸要正舍舉遵目月懇時法而元乞斗令保旦度主不護起師三獨肉每引元飛身逢朝薦昇尤朔先之立爲望天上待養時斗帝而身節姆上行之本三帝功道命元註行體生大名法之辰帝玉無毋先求籍不忽讚道貫無爲聲聞玉闕曰應詔飛昇起不同崛營宇舍證道有三遷之境靜深高也蓋煉已築基已遷靜地地雖靜猶在人間也遷曰高遷崇升於帝闕也深遷者靜遷功就尙未高遷入窮岩以煉神坐枯石以面壁九年一定將以還虛也夫寥廓之區烟霞之宅人跡之所不能至風雨之所不能侵鳥獸林泉畧無可驚怖此非七尺軀能遍覓也惟是陽神遠厯愼擇幽棲命社令山神守茲淨域俟我功成行滿負手歸來無爲以證湼槃如是焉爾已此積功已竣之圖而列之於此者蓋此後泥丸已歛陽神不外遊故宇舍之營在先事也讚入山必深面壁爲眞曰飛尋佳勝大哉陽神歛泥丸陽神者還虛之母也非游戲玩弄駭俗以驚人也宇舍旣營陽神事竟諷心印經一萬三千巻斂諸泥丸湛寂深藏永無出入且行功積行總惟身體官骸非可假陽神聊相攝也是故形會意意會神神會道不先不後不疾不徐惟盡人合天無負傳心之望讚旣出復入雖滅實生曰泥丸一點銷鑠全身第十三積行富貴解人曹器杰著世事雲連酖毒在宴安之地天心玉汝陽和從栗烈之餘喚囘蜨夢五更初半藉重巗風雨穿透鵬池千仞上全憑大海波濤故禹甸𤱂𤱂玉食報隨刋之烈周原膴膴金甌酬播種之勞銷俗骨以辭塵百尺竿頭須更進換淸軀而濯月三山峰頂好同歸惟嘗膽與卧薪自超羣而拔萃玄科分十二請擇善者以從妙行積三千應謝時人而去朝名山朝山非以縱觀遊搜奇而攬勝也蓋洞天福地皆仙佛之所憑依亦猶攬轡未登先謁主司於府第凡以自通耳且夫封泰山禪梁父帝王之敬禮甯炫玉書金簡之文葢當其治定功成乃以祈天而永命後聖至化神而後夫亦成定之秋也故積行之初重名山之仰止顧其遠者數千里或萬里而遥匹馬孤帆亦可紓其跋涉然非所以云積行且表厥誠也戴月披霜但著幾兩屐而一瓢一笠無短僮瘦馬之吟則行爲五百倘按步叩禮沿途不懈初心則行加一倍詩萬壑松濤百丈崖逶迤石徑窘芒鞋曰探奇欲上雲峯立橫覽神州一放懷尋仙蹟神聖飛翀勝地祗餘往蹟矣然或依山而煉性丹臺飛五色之花或借徑以流慈黃鶴舞千年之瑞後聖於朝山之會遍探流風陟險窮幽不惜旁求辛苦要必以吾之敬禮潛孚往聖之精神若援琴之遇文王而羹牆見唐帝也是則行爲五百至若仙踪剝落廟貌陵夷或慨募以重光或構基而締造其行則倍焉詩興雲靉靆只從龍不信山空洞也封曰寂寞靈湫飛澍雨鶴軿何日返仙踪住禪院仙宗釋典不相爲謀然方積行以自修豈尙强分畛域况名山幽境僧占爲多故積行之場莫如禪院住禪院者擇山中大刹暫息芒鞋則屏絕囂塵猶是巖棲舊事重以往來僧眾則供億之役繁昕夕不遑乃以程吾勞勩更於人之所不屑黽勉而安之則終始一心斯不見人相我相三年無過行記二千然作息之餘稍露陽神駭人耳目雖欲彰吾教正其所以踰吾閑不惟無勞之可名且將有大咎詩浩劫微塵兩不侵閒抛鶴氅挂鸚林曰晨鐘驚寤霜天曉土木形空水月心募義倉積貯者生民之大命當水毁火旱萬戸嗸嗸天地亦難自主故救荒之政十二積貯爲要圖漢天師當珠粒之秋捐施數萬石受符膺籙遂贊泰玄聖眞丹術雖成尙難博濟况旣云積行正資募勸辛勤勿憚程途勿分眾寡多多益善汔於有成俾穀積倉盈以防凶歉賑荒一度行記二千然勸募之時難必信從者眾則顯仙踪以覺世昭靈跡以感人不必愼如禪院詩潄嚥華泉養谷神逍遙忍看阻饑人曰濟生普給壺天露沾漑潛消爨釜塵煉外丹内丹未成者外丹難弋獲而外丹不煉莫溥濟人利物之功故削雪成銀耿先生之戲術安鐺煮汞張永德之神奇陳允升塗紙爲金葛芶漏庀材覓藥仙家妙用種種難書聖眞當面壁之先尙未盡從心所欲謂之煉者蓋猶有借於靈符祕咒跽諷天章購物程功殫心而竭力此中玄妙臨時自有師傳未便明言啟貪夫之覬覦故列諸積行俟後賢煉度之勞詩活火流珠貯玉函何勞望氣鑿巉巖曰點金賤到人間土少伯書奇竟可芟宣正化人性皆善以氣拘物蔽而漓故世道人心遂與江河日下吾修吾性命非以徇人顧野鶴松邊演三車之奧旨祗園樹下宣四諦之眞言而吾道之王重陽邱守拙揚風迪教朝野傾心焉聖眞矢願化人必擇通都孔道蓮臺寶座相時宜而說法講因風雨燠寒不辭况瘁感一人爲行一百十人則行千倘囘奸惡以從忠挽奇衺以反正行依人數而爲十倍於前詩隨方演說覺羣材拱聽良言夙抱開曰猛醒迷途知未遠故衣曾帶寶珠來執弟業立志中之訪師未修道也積行中之執業已出神也顧訪師在虛心以受法而執業須勞力以從遊夫此身已證化神尙何須乎模範而必至心勞勩者正不安小果而至德無常師也且聖若宣尼猶師項槖李謐五經之彥而曾事孔璠雖靑勝於藍冰寒於水而小心翼翼時以虛受人惟是山川雨雪不憚艱辛夏楚譴呵益加敬畏厯十年如一日則行記三千詩一擔琴書萬里遙西風暮雨任瀟瀟曰親師立滿瑤階雪便許春田長藥苗授玄宗聖賢之授受大道爲公祕以自私者褻天之甚者也夫重陽演化證眞位者七人而漢代雲房粤數百年而尙覓玉淸内相誠有見於大公無我不容懷寶而迷也後聖至陽神旣變以還固不堪濫及匪人蹈紫陽之故轍而天涯海角物色於驪黃牝牡之餘開牖納之誠心善鈞陶之雅範上延五祖七眞之派下啟千秋萬世之傳加意玉成准記三千善行詩茂林乍聽鳥聲呼雨灑醍醐露濺珠曰春色滿園桃李笑也知靑帝費功夫諷皇經經者神聖之寶燈法界諸天之眞印至心禮誦隨感而皆通文昌諷大洞眞文天神効命而况金函玉冊啟九天寶祕之樞鳳篆龍章開三界津梁之鍵故功德爲諸經冠而天魔示現於聖眞而倍嚴方諷之初則有淨壇丁甲推鋒露刃英氣莫可攖一七而湔腸三七而聰閉四七五七目光蔽而有傾跌災六七則雷兵之霹𩆝交加經壇震撼四十九日豔女來窺一念偶疎肢體旋皆崩析惟是存誠主敬始終安湛寂之天保護陽神不驚不間諷之百日記行四千是爲圓滿期欽哉毋忽而諷須擇地宜在深山古洞間詩龕燈光照月千江七寶莊嚴映綠窗曰花雨一壇香霧暖毒龍癡虎衞幡幢拜玉墖玉墖者何上帝之寶光現圓明於妙相也光在皇經凡十七故墖之繪像分十有七層拜光者懸挂光圖對諷天皇聖號按光觀想拜某光而卽以某光冠之非僅如羽客醮壇鶴氅星冠誦揚而禮拜然必三年願滿始終無怠無荒愒日玩時則拜猶不拜後聖至心皈命拜終則記行四千至如玉墖之光圖科儀禮拜諸條式乞度師指授愼毋蹈於愆儀詩瞻禮高穹一瓣香玲瓏影現玉毫光曰葵忱儼造彌羅境碧落空明曉似霜勞筋骨天體運旋日月星辰皆流轉蓋陽精主動動而有常惟行健自强所以永貞而不息聖眞自入山以後皆寂靜而幽閒有以勞之斯靜專者動直矣况自古英雄賢喆惟勞乃有成漢昭烈因髀肉之生慨焉流涕陶廣州無事則運甓於衙齋寕欲證大羅反惜辛勤力耶通明邱相涉冰負行人胼體裂膚不遑恤王老攜家沖舉空際猶聞打麥聲不以勞爲勞而勞乃至矣故或梯山涉水任重遠馳以佽征人以行已志三年不怠則行記四千而他日飛翀亦視勞之大小以相酬令勞而永逸詩紫陌塵飛碧水流鶯歌燕舞十三樓曰最憐野鶴雲千里譙羽嘵音未肯休燃體膚我聞佛事歌利王節節支解時不知人我相而吾教黃眉翁服氣洗髓而伐毛蓋骨肉皮囊恐不足高飛輕舉何若一時强忍畧銷融於面壁之前故大燃者惟玄帝其燃四十九後眞能崇效行記七千中燃有正陽小燃有杏林石氏中燃二十一小燃者一七之名也中與小有分故行有六千五千之別此燃膚之大凡也夫性命之功功先成已然性命已負且固不能無體而無方終難合德於崇卑而極彌綸之盛事聖眞積行非必於金科十二皆按節以畢符而擇善以施參以行功之大較自得躊躇滿志而内外兼成詩願甘鑠骨並銷筋陶冶靈軀逈不羣曰慧炬排光通玉陛灰心供養嬝烟雲第十四行功鐵杖老人李元中著慈航有諦檣帆迴業海之波法雨無邊霡霂起枯苗之穎成已成人成物斯兩地以參天立功立德立言可存神而過化故從龍潤礎沾甘澍於堯雲顧兔維箕拂薰風於舜瑟藥轉三華之采黍谷温囘符飛六甲之靈魔天影閉浣仙塵而反骨全家之雞犬皆昇超佛劫以辭胎七寶之鏡臺普照逐篇伎倆須舍易以從難如法循行在因時而審勢遣風雨風雨曷爲遣以囘天也天曷爲乎囘以膏苗以息火也火可息苗可膏乎曰可曷以可曰亦猶行古之道也古之道奈何欒巴噀酒燄靖成都葛玄飛符雨甘京國古之人有行之者天可囘也蓋聖眞道成代天行化旱旣太甚雨以膏之火燎而炎則囘無阻之風以息之然則曷以雨曷以風曰法之傳道成斯獲雖預白無以爲也遣以符遣以咒也反風功五百祈雨者千久雨祈晴功三百招風功一百惟其貞詩天倪澹遠性空濛喚轉風雲片刻中曰長嘯一聲人不見亂烟初㪚日初紅逐蝗蝻春秋重民命謹天災是故蝗則書蝝生則志蝝者蝗之子蝗者蝝所成田祖有神秉𢌿炎火非好殺以生禾也然則蝝無形則火之蝗已羽則風之風之於斤鹵海濱命可全禾不害此遣風之一奇也蝝之胎胎於地冬有雪則深入地下因雪之次數而入愈深焚眞乙罡符蝝斯浮出出則火火則除除蝝是爲二百功驅蝗功三百故周一淸之修道也作書諭蝗神神奉書遂帥蝗遠遁此得驅蝗意仁義兼也順好生之道道故成符有度師傳傳待時不具錄詩火速靈文號召時靊霳搜捕種無遺曰未經撲滅薨薨羽急遣飈風送海涯驅鬼怪曷爲鬼怨鬼遊魂也怪者何精魅也曷以分鬼怪入室觀其氣氣有分曷以驅驅以類祖天師之除魔鬼旌陽之斬蛟囘道人入宮命關壯繆皆驅也其明證也故鬼有宿怨則解其寃魂之遊則超使度洎超而解矣而猶肆其侵陵是宜驅驅以小彪法小彪之弗去是曰怙終申疏諸天謝罪吿開戒乃用大彪法法不預傳恐輕試精魅爲妖妖則妄千用五雷正法法在驅使去勿賊其生一度記功千毋輕殺然有隨身將法乃効靈故預煉罡將一員供使令詩千靈敬仰一身孤不仗靑蛇崇自驅曰卻怪湧蓮香水鉢雷峯㙮錮冷西湖利幽囚吾道慈悲重度人尤思度鬼葛公相薩公師位證大羅用斯道也然則鬼將曷以度憑吾道力利以神利之將奈何四時之序八節之期諸天赦罪消災之令會牒掌陰天將令釋幽囚送醮壇聽法諭法曷諭乎爾天堂樂地獄可悲舉吾證道因爲剖吿吿斯悅悅斯悲流涕而求度於是淨我化神之舊府吸幽囚用無爲眞火煉七日止火出定吹氣向天送詣南宮紫府間俾證道道在至心觀想另有傳然後爲誦三元解厄經禮皇懺俾消往罪祈證因一年三次紀功千十年功萬萬功滿獲飛昇是爲冠諸功他皆弗若詩黑海瀰漫渡莫能風凄霧慘欲成冰曰慧光忽化流金火煉散愁雲十八層勸孝悌木有本水有源源本在人爲孝悌本實撥人也而禽滋長而發榮先培本聖眞道濟重本源爲撰良言談果報爲木鐸爲暮皷晨鐘爲霹𩆝雷爲浸潤爲深爲淺爲感爲懲苦口慈腸提撕而警覺化人而人化功三千普曁大千發天性爲太和用嘉乃功功萬萬飛昇操左劵簡在帝心位極天人不在三元下詩春囘沆瀣露囘霜烝乂庭幃翕雁行曰蓻得萱荆花笑否交柯繞砌藹天香遏貪淫貪淫者何孼海也曷言乎孼海貪斯逐逐則昏淫則迷迷斯亂縱情濁性焚如死如棄如毒流爾後人莫之覺也古今之大愚也遏之將奈何曰惛者燭以燈寐者驚之覺濃者淡之熱者寒之悚之以天地鬼神如斯而已是故格一人使悟紀功千感而讓金厥功倍鳴呼化炭爲妖幻旌陽所以試及門也不忍點金悞後人洞賓一念而成聖也知此義也故貴遏貪淫詩濁浪排空到海渾奔流氣勢囓天根曰勞將柱向龍門砥澈底淸漣戴禹恩療疾苦療疾苦何也推我長生願延人世之年也孫思邈療龍徐秋夫療鬼非我族類欲並生之而况乎同類故桐君之錄肘後之方千金之祕義著書濟世證天醫療之將奈何曰外丹可濟也望聞問切可憑也否則罹先世餘殃而或天人怨怒也爲禳解爲詔之自新爲勸好生爲遷塋卜宅而後投以劑一服俾瘳愈一人功一級若鐫新論廣良方垂久大之模功惟重詩棕簑斗笠舊生涯一個葫蘆萬里家曰甯有禁方三十首返魂香借白硃砂救貧窮仁心無旣也而勢則良難勢難則曷以救之而俾無失所曰吾力之所及而願以將之願之所至則周之而貧窮遂矣曷言力之所及也曰目之所及見而吾耳所及聞也救之將奈何曰解推以通之而外丹可濟也抑倡之自我而資同善於人也衣食全資斧給妻孥贍喪葬完而貧窮救矣未也彼夫啣莫白之寃逋公私之負窘於勢者薄於時者而排之而雪之而償而散之而解而紓之則是仁人君子之用心而平造物不平之憾詩兩袖淸風酒一瓢經年事業只蕭寥曰壺中貯有慈雲在垂手窮途渡法橋活萬靈曷以名萬靈鳥獸蟲魚骸骨也骸骨曷以言乎活活於聖眞也曷活於聖眞以道力也今夫擲杯可爲鶴石可叱爲羊葛陂之杖可爲龍飯可爲蜂蜂爲飯無情者可活而况羽毛骨角之猶存然則活之將奈何曰萃骨於一區步斗罡結龜印先煉以吾三昧火復取東方之生氣而咒以吹之咒有傳度師可授也少焉肉白骨復囘生故曰以道力也旣生後𢌿放生池院乃保全若聞殺而不見其形則誦往生咒十遍以吾意會物形送於冥曹求轉爲人道行之一𡻕厥功千至見殺而曲全之理所宜不具囑詩物苦操刀慘若何曾將鐵案奪閻羅曰殘形偶沐吹噓力飛走旋看喜躍多甦五穀五穀成於地培於天曷以甦甦枯爛也曷以甦枯爛旱澇傷也蓋霪雨爲災禾斯爛甦之將曷若曰聖眞當水退步斗罡手印結三山腹吸東方之生氣煉之一晝夜念眞言呵眞氣於田禾斯起穀傷旱則將枯枯者曷以甦灑以北方眞坎水灑之會誦眞言眞言悉不傳傳恐褻如法流轉穀故甦至若視其禾田凝黑氣是農人有咎獲戾於天則代釋其愆爲䖍誦皇經三巻證道愿甯遲一紀冀囘天天鑒其心枯爛之禾可活也是爲無量功一度三千功上達詩雨暘傷稼拂常經力挽天災幸有靈曰苗稿浡興歡士女甫田盈望已靑靑興廢教儒道釋教日月星也三光不可磨三教烏能廢教不廢曷云興蓋緣教中不肖徒予以可乘隙復開衅於奸貪軰遂以構其緣蔽主聰聳官聽矣興之將何以藝祖除佛教禍將延薄暮偶微行適見頭陀醉卧地帝震怒念益堅僧乃蹶然興婉言謝藝祖夜已暝非帝獨行時卒有不虞悔何及吾護汝速歸爾宮帝乃悚然得不廢元世祖之謗玄也尊釋氏中宮方彌月帝望生男詢國師師曰女也國師者楊璉眞伽世祖所崇信言應如枹復問邱長春曰靑宮主器然知必公主且聞國師言對以男思以勝國師俾帝悟玄之妙也旋以衞教故露祈上帝轉陰陽旣乃果得男故益重長春崇道教興廢教者施大法力顯大神通悟君心全民命俾感悟教乃興興教者功萬詩祛盡浮雲捲盡愁靑天已補月重修曰撑開世界烟霞外揮手歸來鶴背秋度眞言眞言曷謂聖神心法也曷以度發前人所未發啟後人也又經以懺名玄理倍深多咒錄出生死消罪愆福夀所由增功尤劇聖眞撰著紀萬功且夫道德五千言太上傳關尹厥後復以南北斗經錄授天師厯代聖神語錄交相授金繩寶炬度盡有心人故功德無邊超塵出劫金丹心法余輩不邀功惟望後賢不負苦心願内丹就功行圓加面壁九年而證飛昇之果消凡累入化神億萬斯年度九祖至矣微矣𤓰以加矣而大人之事畢矣勉之企予望之詩羽化眞修何處尋漫憑往籍認傳心曰而今祕授飛翀訣珍重琅函値萬金第十五面壁盍縷道人何淑淸著應物有心卽空卽色參生滅觀心無物非色非空入化神置理亂於罔聞靜向深山留太古斂英華而不露長斯兀坐葆眞倪故幻實還虛恍若牟尼證湼銷丹合道幾同顏子齋忘黃石本吾師據石鎭九年之定赤峯原我友登峯樹萬載之身統儒釋之精功天成節奏鍊淸靈之眞體人看飛翀何處是龍門只此五言古調到來承鳳誥方知一片婆心道行堅凝内外丹並成辛苦亦云足况乃厯諸艱修途頻局促厥身不憚勞矢願鐫心曲朗朗冰壼秋寒光照初旭金石差可擬縝密温如玉義理一肩擔大任天斯屬我志幸已酬我行幸無辱應當拂袖起超然脫塵俗偈一箇骷髏滿腔道德曰縱惹摩挲應規合則聖功圓蒲拂袖喜超塵騰身出風火長嘯賦歸來了非前日我囘憶樹功時慘澹修眞果溷跡在人間愛除人間禍風雨一麾中孼衄蛟龍鎖隻手散陽和菩提妙薩埵默契上玄心金冊藏靑瑣高蹈覓雲窩幽栖釋擔荷偈彌天葢地般若神功曰一切色相逐葉隨風帶舄歸山何處卜幽棲空山我故宅石老華髮深邃徑無人跡寒泉潄靈根罡風摩高脊幽然太古初寂靜良可適去去別寰區舉足雙飛舄絕麓瞰遠峯捫蘿開荒僻野鳥不飛鳴眾獸罕棲踖天地一孤踪孑然以朝夕偈仙乃山人惟山合道曰絕塵而奔是登是造跏雲坐石孑然托深山胸中仍則箇詎若遯世翁頽焉覓枯坐怪石截爲屏風雨曾洗磨斑剝負文苔古薜濃陰大面此壁立峰朝夕忘起卧寒暑不相干於何勞饑餓綠草纍吾茵白雲擁我座湛寂無噓呵趺跏是功課偈山内雲生雲中山立曰是山是雲分他不得諸魔悉退趺跏無噓呵澄靜固云極不見服氣人淺根疎道力自將魔作幻作幻爲鬼蜮長袖曳輕裾繡帶垂華飾優戲擾厥旁撮弄相迷惑若彼功行深罡風淬寒色神人悉退聽何况此蟊賊天日章光化無從滋偪仄偈說魔自魔知魔不魔曰掃除一切於意云何萬法皆空偪仄幸無魔或以仗諸法法力亦佳哉毋乃肆彈壓而我於其際一切皆融洽鉢水瀉深溪劍光收寒匣天籟與梵音寂靜無喤呷内外空所有於何繫胸脇囘思皷神通如兒嬉肄業洞洞復冥冥㗳焉頓消乏偈在法言法去法弗法曰者箇枯禪四通八達外息羣關洞冥頓虛忘著著都放下六幕與九垓了無容心者金液旣不餐見聞蓋亦寡嶺月自光輝松風空奏雅祗此一息間元氣吞還瀉念彼棼塵内物物皆豔冶在昔已屏除何待今日也凡慮不我攖五關自瀟灑偈無來無往何去何從曰非耽寂寞緣我癡聾内觀眾妙息關慮不攖詎乃如槁木脉脉黃庭裏靈明媚幽獨運行侔太虛晝夜三十六返照自相推度數周還復要皆任自然而非同强逐玄中更有玄一氣渾淸穆理則含太始功則儲修育以此坐懸崖内觀淵以肅偈入定不定乃爲眞定曰内照返觀心與道印鑠骨煉金淵肅坐懸崖朗然通寂照寂照將何依踐形乃爲肖神淸而骨重安得虛皇詔賴有圓融性湛湛含光曜煉我無始身證我無始妙我輪不可轉我形不可耀寶覺有眞心定滅德彌邵金骨一朝成金仙度圓嶠偈炙火銷金非文非武曰無更有無超規軼矩融膚化土煉骨以煉仙厥器修𤥻土假合本四大軀殻尤易腐欲超第一乘蟬蛻那堪數緬彼大羅人飛身入瓊府胡我皮肉像難作金天輔不觀三界身宴坐擬皇古舉止備如常淸潔追玄圃因成不壞眞默契無上主偈心本天君肉爲枷杻曰斬截覊縻永垂不朽約神九載不壞無上眞涵泳愈難薄九仞一簣功安敢自淪落神居三品先約之還再約旣如川中波悠悠常絮絡又如天上日時時無住腳倏忽至九載色身猶槖籥精與氣重融性與心相著世外有乾坤眞神自冲莫偈片刻終身九年一日曰住手空山將投仙窟待詔三淸九載約眞神嘉名書玉笈躍然以遠舉飄飄輕且㨗足下白雲飛淸風生兩屧遙溯面壁時境界不相涉一朝闢玄關九漢騰煇燁蘂珠自可侍紫霞自可躡因無三淸命天衢未敢躐待詔處山阿翛然檢丹牒偈振衣待詔證玉證金曰傳書至此了我婆心第十六飛昇三山笛史韓湘著珠騰紫海射斗連牛璞韞丹山穿雲裂石贊鴻猷於玉闕木公金母壓班僚分鷺序於瑤階赤舄緋袍隨舞蹈故嵐飛靑嶂啟鰲峯浮十二闌干瑞擁赤霄低鶴背靄三千纓絡麗光明之色相日月歸壺宏久大之規模乾坤在袖蓮栽烈火動撫今追昔之思笛弄長風興推已及人之願數載辛勤旣慰自當拜手揚休茲晨圓滿堪歌遂爾揮毫擲句頒恩賚詔帝簡遥聞眷露壇書頒上苑紫泥蟠金星日麗輝章彩玉軸雲移燦錦紈扈從鸞旗雙影度捧宣鴻誥五花攢空山景色皆呈瑞霧暖靑崖翠繞闌偈道契天玄頒恩賚詔曰偌大寵榮惟人自造奉敕騰霄莫羨文明咏在田峰頭伫看著先鞭華增旌斾千行綺綵湧林泉一朶烟乍拂岫雲歌别曲漸忘巖瀑響幽絃舉頭日近長安遠差喜無多到碧天偈旣來天詔奉敕騰霄曰靑冥寥廓任我翔翺騎驂紫鳳翽羽翩翩瑞也𡽪端趺飈舉邁征騑嗈喈雅叶塤箎韻苞彩愈揚黼黻輝白鶴就班先路舞靑鸞歸馭帶霞飛囘眸再向蓬廬望磬控天遙藐翠微偈升彼九霄騎驂紫鳳曰儀仗紛紛天迎人送樂引靑童紫雲香駕厯晴空樂譜鈞天縹緲中銀漢水淸音九奏玉霄風細曲三終笙調翠琯分緱嶺拍轉霓裳應月宮聆取洋洋聲一片步虛流響入鴻濛偈鳳驂駕矣樂引靑童曰梵音玄籟曲度天工涉漢登朝伎樂雲從越漢津砥平御道厰金銀光騰八表皇居壯翬耀三垣眼界新宮樹蔭濃恆不夜檻花芳靄妙生春靈霄殿逈停仙仗曳履欣隨侍從臣偈靑童扈道涉漢登朝曰通明鵠立位我班僚入宮覲主一聲鐘韻肅寥陽内使傳呼拜玉皇爐裊篆雲熏鳳幙蓋懸珠絡映龍光綸載錫和風暖芾舄初承湛露香擬向彤墀𢋫介福玄穹嵩夀已無疆偈朝宁旣登入宮覲主曰稽首揚休雲龍風虎趨參列闕麟宮梵陛峙重重拾級趨參禮恪恭玉珮鏘鳴仙樂合錦袍沾惹御烟濃玲瓏複閣翔胎鳥屈曲飛梁瘦古松優奬曠恩醲似酒紫虛瓊殿語從容偈辭主出宮趨參列闕曰妙相莊嚴容吾晉謁俯眺蓬山島嶼凌空費仰尋羽輪遥度發高吟珠泉倒瀉芙蓉巘繡閣喬蟠翡翠林萬里去來超弱海雙鳬瀟灑躡孤岑崔巍樓館人何處瑞藹昌雲圭卓淺深偈趨參事竟俯眺蓬山曰方壺圓嶠不在塵寰瓊筵徧賞玉殿親叨燕樂歌筵開玳𤦛旨嘉多堯樽影帶昭陽日禹膳膏流太液波檢奏三章鏗玉節璈彈九氣鼓雲和今霄歡飫天厨味頗有光輝出大羅偈玩罷蓬山瓊筵徧賞曰飽德𢋫颺冰淸玉朗洞府新成賜第天仙寵倍榮名山深處築高閎月摇金碧檐牙動雲擁虬螭棟角生晴圃景融花爛熳曉峯蕭爽鶴飛鳴殊恩更荷醍醐渥別構霞莊讌海瀛偈瓊筵旣御洞府新成曰寶臺珠樹五色晶瑩神驗前修南山之北北山南煉炁還元舊所諳曾倩五龍盤玉顆頻教雙璧合銀龕光涵赤水菁英歛暖溢藍田趣味甘掉首從將空色勘聲和碧宇月澄潭偈閒居洞府神驗前修曰幾經閱厯景駐丹坵心期後學翹想淸都路可遥仙槎耑待泛靈潮祗憑鼎内三華藥不藉雲間萬里橋瑶草正宜經雨秀紫芝何幸沐春饒慧參妙諦甄陶久拭目聯翩上九霄偈密證前修心期後學曰佩我丹經承恩錫爵金丹心法後跋孔子曰作易者其有憂患乎蓋易始庖羲而式微於夏商之末文王繫以彖而啟開物成務之功心法之爲書亦猶是耳悼斯人之陷溺而正道陵夷譬彼舟流莫知所届用是臨塵界經障魔數載辛勤搆書以覺寤詳而不蔓簡而不遺朗若列眉洞如觀火毫髮無餘憾而證聖之心燈也爰懽忻鼓舞稽首而頌曰大道無倪神功有鑰爲馬爲龜則河則洛爰開慧路式卽珍田言因性立道寄形詮木鐸迢姚金機逆順化雨之時春雷之震星開北斗月湛南江抽思乙乙𥪡幟幢幢微顯闡幽韜光歛鍔劍匣𢙇稀燈帷錯落原原本本穆穆皇皇有倫有要無體無方揮霍須彌析分芥子義則含宏辭非的詭上中而下天地與人三才窔奥一貫瀰綸控引情宮疏通性海緗帙含馨筆花絢彩焜煌宇宙反覆山川字傳十六言繼五千化啟玄塲功開紫府糠秕浮埃鈞陶下土殷勤誦覽昭示津梁桃谿李徑雀躍龍驤祖師門下柳守元敬識金丹心法後跋八祖心法成堅得諦觀其大畧流連往復不能贊一辭乃愾然於一切修眞養性之書讀可也不讀亦可也蓋因心法而旁收別集則參其異證其同益恍然於心法之畢該而折衷之得所主曷以言乎讀心法而他書可悉捐也心法之爲書廣大精微無弗備諸編所載莫不彙其中是猶登泰岱之巓而鳬繹龜䝉眾峰如兒立故玩其淺深之秩秩節次之昭昭脉絡精神支分而流合乃轉嘆予昔年之訪落有志於飛昇踏破鐵鞋而得是編不早也顧宏奬後進而畢揭其心源予將敬拈瓣香稽首頓首遍拜諸天洞府爲大千世界稱謝慈航爾然其艤舟於天河以待問津之渡囘頭卽岸覺路非遥乘長風而飽征帆波羅在目矣而不然者舍舟而亂流以濟或汔濟而貽濡尾之羞洞口桃花竊恐漁郎迷徑耳蘭漿桂棹擊空明而沂流光予亦將鼓枻而歌而望美人於風虎雲龍之會合祖師門下石守堅謹識金丹心法後跋鷲嶺岧嶤業邈波羅之諦壺天湛寂常留洞口之春飛紫誥之靈文不待攀龍鼎下結靑神之妙契何煩抱犢山前然而肉眼迷茫錯寶碔砆驚白璧塵心眩愕空將魅魑詫蒼龍誰分太極之泉罔辨元和之液八祖金丹心法崑山削柱聚窟凝香標羣嶺以中黃弱水豁三千世界揭恆星於太紫層城分十二樓臺不侈風螭月母之譚上接危微奥旨非陳丹溜玉杯之論宏開道德奇文言有大而非夸意無微而不入但使因言索解毋泥格以求辭會意旁搜必尋端而竟委則古洞啟桃花之徑人分絳雪而來春田懸桂實之英藥杵玄霜以去車馳八景行藏偕五色烟霞馭叱三淸往復任雙鳬蹀𨇾時與赤松上下笑遼陽之塜纍纍漫從黃石逍遥看姑射之風襲襲予光分綠簡杖持靑藜藏柱下之鴻篇色集宮雲紅近日待人間之鳳舉香迎仙珮暖宜春謹賦短章附蠅聲於驥尾還期來學同鵲起於龍門祖師門下溪守靜稽首拜識金丹心法後跋練道參神端基於勤學知行不並用無以期誕岸之登且將陷溺之日深流蕩焉而莫知所返此正陰長生所云奔馳索死不肯暫休卽使神仙現身化導而言之無奈聽者之藐藐况著書以警世又安望夫束諸高閣者而索解於知行不屬之餘則我八祖之垂爲是編幾爲選事矣顧此書未著未嘗不相與有成宛轉尋源闢開塵垢縱心孤往無所鑑而猶興然而其用力也勞而得之也亦非偶旣有是書以後則大道之源流具條目彰途可循轍可守矣但使知行之漸進以相深於研慮而悅心所爲事半乎古人而功效倍也學道須勤學勉之勉之然第知所勤矣而不體傳書之本意得人而不與與人而不愼其人是懷寶迷邦大公而以私據也抑甘心比匪不知君子之貞也此之謂褻天褻天有逸罰予旣樂是書之告竣而復恐後人之不戒隕越以貽羞故附此數言以爲讀是書者之明訓祖師門下梅守璞謹識金丹心法後跋嘉慶二年六月十八日予晤持眞子於濟南得覩金丹心法一書𢙀然起立而嘆曰妙哉道也此眞身心性命之學世出世間之樞機也心法何法法在一心法心何心心止一法眞字字是金令人人得丹如披雲霧杲日當空矣夫世之丹經徧天下大抵統言體用槩論工夫求其顯闡袐奧直指根源易簡精實節目貫通未有如此經之深切著明者何期小子得寓於目得傳於口得會於心得體於身復得續跋篇末以質後人斯誠億萬刼難逢之奇遇也惟自愧管窺蠡測莫量高深了了於目何能了了於口了了於口何能了了於心未及升堂入室敢言澈底洞明耶所願與一二同心人由下學以期上達自卑邇而晉高遠躬行實踐共完性命以合天本固華榮妙鍊形神而證果夫乃信諸天不外一心大道總此一法撥轉關捩直臻無上潛心消息益覺精微矣後之君子幸覽觀焉祖師門下蔣予蒲敬識心法文評香飛玉札祥烟飄萬縷之霞彩拂霜毫瑞靄艷千層之錦月色更添春色好胥默會乎帝閶鐘聲還與皷聲齊抑何辭於靈瑣予也心懸北斗地傍東山十載儒冠餅嚼紅綾之饀三年案牘符分墨綬之銅當拂袖以歸田但守靑緗綠簡保餘年而食德何如白雪黃芽然而一夕無常活潑鬱鳶魚之性竟使三生有幸精神偕鶴鹿之班雖經筵莫贊高深而緒論猶工諷詠聊爲蠡測竊殿鴻章文章至漢時風度猶爲近古蓋虞夏商周之後元氣未漓也鍾離老祖文璞玉渾金不雕不琢沈酣濃厚而節奏天成初讀之覺樸素無華不過疎枝大葉而細針密縷踪跡莫尋殆將與二賈之文爲鼎峙矣文家有三變而簡老爲難必其藴蓄旣深陶鎔一切然後剝膚見髓老幹扶疎細讀李祖文益信然矣後世漫無根柢一覽無餘以枯木寒鴉而輙託名於公榖乃從而名之曰老殊堪一噱著筆如不經意而味美於囘其息深深文家之逸品也蓋風來水面月到天心雖其境界在目前要自有一般眞趣張祖文章踏實而意解空靈不事矜莊不假聲色屏謝人間烟火而得南華氣槩之醕典麗堂皇最是文章正格王謨帝典所以獨冠冕古今故不事纎奇望而知爲堂堂正正之師者此何如境也我祖師矢口成音自協黃鍾大呂不爲摇曳態而五色成文蓋惟道力深沈自所發而皆天籟行文譎怪最下乘也蓋牛鬼蛇神不過於無可奈何中出偏師以角勝耳然至其流於旣溢未嘗不發爲光怪陸離曹祖之文古而帶拙如覩商周法物斑剝矞皇遂令深心好古之流愛玩不能釋手不露鋒茫而自然淵雅此恬吟密咏文之最足移人者也蓋含英咀華風流藴籍自令矜心頓釋而躁氣胥平讀藍祖之文如對霓裳羽衣曲其悠揚足娛目其鏗鏘足悅耳殆將與有宋之歐陽平分一席筆輕辭秀原非文字上乘蓋氣體無餘易流於柔媚也不知手腕靈妙古秀在神骨之間得之最難而讀之不厭何祖之文機員神足鮮湛不滯亭亭如初日芙蓉此所謂天仙化人非肉眼所能窺測也予誦韓祖文倍覺起敬起畏焉爲其腹笥之飽滿而靈秀超超且成大道於妙年故吐露之間自有一種英光之燄咄咄逼人也至其家法本文公而自爲減𥪡者則又爲有目之所共覩而何俟贅言漫志八評雖未盡文之閫奥然體裁局度字句篇章其律法凖繩或堪彷彿其十之一二後之學者當不河漢鄙言也然而讀其書思其義廣其志踐其行方可從流以得源而驪珠在握矣而不然者啜其糟粕而不知精液之何存是則楚人之賣珠而鄭人之鬻櫝耳攬春華之秀旋落其實而取其材斯石室奇緣不負素書兩卷予三年侍側幸編次之有成敬跋短章以貽同好祖師門下闕里華玄邱頓首百拜天仙金丹心法後跋嘗聞金丹之法不明則天仙之道不顯天仙者就五仙而言之則爲最上之乘就專派而言之則爲妙道之統是有心法焉固未易爲一二外人道也余自通籍後浮沈宦海實不知仙佛之道盡人可學故頗敬之慕之而未敢易易求入門矧能講明法派耶年來留心典籍竊窺三教同源之理又幸得所依歸日承面命耳提之訓乃恍然知章句之學拘墟之見其不足以語大道之心法也久矣茲書之作雖成於八祖而實孚佑上帝一人綜成之仰見慈心普度厯千百餘年如一日昔人所謂繼武慈航者洵非虛語故每雲鶴至止或則自埀寶訓或邀七祖偕臨總一覺世之法以洪大化而正人心實按之原不外乎綱常倫紀之大端精求之乃隱合夫身心性命之妙諦然則此一心法也固不僅八祖同此一心法卽三教亦同此一心法也推而至於萬事萬物總此一心法爲之主宰默運於天高地厚之中也謂之天仙金丹可也卽謂之太極謂之明明德亦可也謂之圓覺謂之牟尼寶亦無不可也蓋總一心法也茲届重訂全書爰敬誌數語以質後之讀是經者志秋弟子范鏊謹跋天仙金丹心法後跋悟眞篇曰學仙須是學天仙惟有金丹最的端是天仙之道非金丹不能成金丹之妙非天仙不能得矧孚佑上帝以天仙立派更爲萬古金丹鼻祖紫陽張大眞人猶在門弟子之列夫豈不以淵源有自所謂私淑而師承者原由海蟾帝君而接一線之傳耶茲心法也雖成於八洞仙祖而小子敬讀柳大祖師原起及各序跋乃知成於孚佑上帝一心之慈濟始終成全圓滿功德如是之恩深無量也現届同人重訂全書正宗小子追隨諸先達後時膺校閱之任深愧望道未見竊幸皈依得所仰奉恩諭准各附識卷末爰於是經敬跋數語惟祝金丹之法廣演天仙之派綿長云爾志喜弟子徐震敬跋
